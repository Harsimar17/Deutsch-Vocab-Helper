<script type="text/babel">
const { useState, useMemo, useCallback } = React;

// ---------- FIREBASE ----------
// Requires the Firebase compat SDKs loaded as <script> tags before this
// component runs (they expose a global `firebase` object — no bundler/import
// needed since this file ships as plain Babel-in-browser JS):
//   <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"><\/script>
//   <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"><\/script>
//   <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"><\/script>
const firebaseConfig = {

  appId: "1:167587188759:web:10fbfb9e36b8aa4fb88c52",
};

let fbAuth = null;
let fbDb = null;

  if (typeof window === "undefined" || !window.firebase) return null;
  if (!fbApp) {
    fbApp = window.firebase.apps.length ? window.firebase.app() : window.firebase.initializeApp(firebaseConfig);
    fbAuth = window.firebase.auth();
    fbDb = window.firebase.firestore();
  }
  return { auth: fbAuth, db: fbDb };
}


const CATEGORY_META = {
  der: { label: "der", color: "#3A5A8C" },
  die: { label: "die", color: "#A5354A" },
  das: { label: "das", color: "#3F7A55" },
  adj: { label: "adj.", color: "#8A6A2B" },
  verb: { label: "verb", color: "#6B4A8A" },
  sep: { label: "trenn.", color: "#2E7D74" },
  func: { label: "func.", color: "#4A7A8C" },
  phrase: { label: "phrase", color: "#B0722E" },
};

// ---------- DATA: fetched at runtime from a hosted JSON file ----------
// The vocabulary itself (nouns/verbs/adjectives/connectors/phrases for A1/A2/B1)
// is no longer bundled in this file. It's fetched from VOCAB_DATA_URL on startup
// (see App below) and flattened here into the same {id, de, en, cat, lvl, example}
// shape the rest of the app already expects, so everything below this point is
// unchanged from when the data was hardcoded.
// Prefer the copy shipped next to this file (works offline / on GitHub Pages);
// fall back to the canonical hosted copy if it isn't reachable.
const VOCAB_DATA_URL = "./german_vocab.json";
const VOCAB_DATA_URL_FALLBACK = "https://harsimar17.github.io/Deutsch-Vocab-Helper/german_vocab.json";

// Expected JSON shape:
// { levels: { A1|A2|B1: {
//     nouns: { der: [{de,en,example}], die: [...], das: [...] },
//     adjectives: [{de,en}], verbs: [{de,en}],
//     separable_verbs: [{de,en,prefix,example}],   // trennbare Verben
//     function_words: [{de,en}], phrases: [{de,en}]
// } } }
function buildDataFromJson(json) {
  const items = [];
  let id = 0;
  const levels = ["A1", "A2", "B1"];
  const nounCats = ["der", "die", "das"];
  const plainCats = { adjectives: "adj", verbs: "verb", separable_verbs: "sep", function_words: "func", phrases: "phrase" };

  levels.forEach((lvl) => {
    const levelData = json && json.levels && json.levels[lvl];
    if (!levelData) return;

    const nouns = levelData.nouns || {};
    nounCats.forEach((art) => {
      (nouns[art] || []).forEach((entry) => {
        items.push({ id: id++, de: entry.de, en: entry.en, cat: art, lvl, example: entry.example || null });
      });
    });

    Object.keys(plainCats).forEach((key) => {
      const cat = plainCats[key];
      (levelData[key] || []).forEach((entry) => {
        items.push({ id: id++, de: entry.de, en: entry.en, cat, lvl, example: entry.example || null, prefix: entry.prefix || null });
      });
    });
  });

  return items;
}

const CATS = ["der", "die", "das", "adj", "verb", "sep", "func", "phrase"];
const LEVELS = ["A1", "A2", "B1"];
const LEVEL_META = { A1: "BREAKTHROUGH", A2: "WAYSTAGE", B1: "THRESHOLD" };

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---------- SPACED REPETITION ----------
// The Review tab is a manual "words I bombed" bucket. This is the other half of
// making vocab stick: an automatic scheduler so words you *do* get right still
// come back — spaced out over days — right before you'd forget them. Each word
// gets a Leitner box (1–5) and a due date. "good" promotes the box and pushes the
// next review further out; "again" drops it back to box 1. Study/Write mode serve
// whatever is due plus a small daily trickle of new words. Keyed by a STABLE
// string (level|cat|German) — not the runtime numeric id, which shifts whenever
// german_vocab.json is re-generated — and mirrored to localStorage + Firestore.
const SRS_BOX_DAYS = [0, 1, 3, 8, 21];   // interval after reaching box 1..5
const SRS_NEW_PER_DAY = 12;
const SRS_DAILY_GOAL = 20;
const SRS_TROUBLE_LAPSES = 3;
const SRS_DAY_MS = 86400000;
const SRS_AGAIN_MS = 8 * 60 * 1000;      // "again" → visible again within the session

function srsKey(card) {
  return card.lvl + "|" + card.cat + "|" + card.de;
}
function ymd(ts) {
  const d = ts ? new Date(ts) : new Date();
  const p = (n) => (n < 10 ? "0" + n : "" + n);
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function ymdShift(str, days) {
  const a = str.split("-").map(Number);
  return ymd(new Date(a[0], a[1] - 1, a[2] + days).getTime());
}
function srsAdvance(prev, grade) {
  const s = prev
    ? { box: prev.box, due: prev.due, reps: prev.reps, lapses: prev.lapses, last: prev.last }
    : { box: 1, due: 0, reps: 0, lapses: 0, last: 0 };
  const now = Date.now();
  s.reps += 1;
  s.last = now;
  if (grade === "again") {
    if (s.box > 1) s.lapses += 1;
    s.box = 1;
    s.due = now + SRS_AGAIN_MS;
  } else {
    s.box = Math.min(5, s.box + (grade === "easy" ? 2 : 1));
    s.due = now + SRS_BOX_DAYS[s.box - 1] * SRS_DAY_MS;
  }
  return s;
}
function srsMerge(a, b) {
  const out = Object.assign({}, a || {});
  Object.keys(b || {}).forEach((k) => {
    if (!out[k] || (b[k].last || 0) > (out[k].last || 0)) out[k] = b[k];
  });
  return out;
}
function srsLoad(key, fallback) {
  try {
    const v = JSON.parse(localStorage.getItem(key));
    return v && typeof v === "object" ? v : fallback;
  } catch (e) {
    return fallback;
  }
}
function srsSave(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* storage off */ }
}

// Ordered study list: everything due (soonest first), then up to the daily cap of
// brand-new words. focus "all" ignores scheduling; "trouble" = words missed a lot.
function srsQueue(pool, srs, daily, focus) {
  if (focus === "trouble") {
    return shuffle(pool.filter((c) => {
      const st = srs[srsKey(c)];
      return st && (st.lapses || 0) >= SRS_TROUBLE_LAPSES;
    }));
  }
  if (focus === "all") return shuffle(pool);
  const now = Date.now();
  const due = [];
  const fresh = [];
  pool.forEach((c) => {
    const st = srs[srsKey(c)];
    if (st) { if ((st.due || 0) <= now) due.push(c); }
    else fresh.push(c);
  });
  due.sort((x, y) => (srs[srsKey(x)].due || 0) - (srs[srsKey(y)].due || 0));
  const introduced = daily && daily.date === ymd() ? (daily.introduced || 0) : 0;
  const room = Math.max(0, SRS_NEW_PER_DAY - introduced);
  return due.concat(shuffle(fresh).slice(0, room));
}

// ---------- FORGIVING TYPED-ANSWER CHECK (production practice) ----------
// Recognising a word in a list is far easier than producing it — and producing
// it is the skill a real conversation needs. Write mode asks for the German
// cold; this grades it leniently (case, trailing punctuation and ae/oe/ue/ss
// spelling of umlauts are all ignored) and nudges on a missing/wrong article.
function foldUmlaut(s) {
  return s.replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss");
}
function normDe(s) {
  return foldUmlaut(String(s || "").toLowerCase().trim())
    .replace(/[.!?,;:]+$/g, "")
    .replace(/\s+/g, " ");
}
function acceptedDe(card) {
  const de = String(card.de || "").replace(/\s*\((?:Pl\.|WG)\)/g, "").trim();
  return de
    .split(" / ")
    .map((x) => x.replace(/\((sich)\)/g, "$1").replace(/\s{2,}/g, " ").trim())
    .filter(Boolean);
}
function checkDe(card, input) {
  const given = normDe(input);
  if (!given) return { verdict: "empty" };
  const typedUmlaut = /[äöüß]/i.test(input || "");
  const forms = acceptedDe(card);
  for (let i = 0; i < forms.length; i++) {
    if (given === normDe(forms[i])) {
      // Accepted, but flag it if they wrote ae/oe/ue/ss for a word that has
      // real umlauts — so we can still show them the proper spelling.
      const needsUmlaut = /[äöüß]/.test(forms[i]);
      return needsUmlaut && !typedUmlaut
        ? { verdict: "correct", spelled: forms[i] }
        : { verdict: "correct" };
    }
  }
  const isNoun = card.cat === "der" || card.cat === "die" || card.cat === "das";
  if (isNoun && forms.length) {
    const bare = normDe(forms[0].replace(/^(der|die|das)\s+/i, ""));
    if (given === bare) return { verdict: "close", hint: "Right word — add the article: " + card.cat + "." };
    if (given.replace(/^(der|die|das)\s+/, "") === bare) return { verdict: "close", hint: "Wrong article — it's “" + card.cat + "”." };
  }
  return { verdict: "wrong" };
}

// ---------- PRONUNCIATION (Web Speech API) ----------
// Speaks German text aloud using the browser's built-in speech synthesis.
// Works offline on iOS/Safari (uses the system German voice when present).
function speakGerman(text) {
  if (typeof window === "undefined" || !window.speechSynthesis) return;
  const clean = String(text || "")
    .replace(/\([^)]*\)/g, " ")      // drop parenthetical notes: (Pl.), (sich) …
    .replace(/\s*\/\s*/g, ", ")       // "der Hund / die Hündin" → natural pause
    .replace(/\s{2,}/g, " ")
    .trim();
  if (!clean) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = "de-DE";
    u.rate = 0.9;
    const de = (window.speechSynthesis.getVoices() || []).find((v) => /^de(-|_)/i.test(v.lang));
    if (de) u.voice = de;
    window.speechSynthesis.speak(u);
  } catch (e) {
    /* speech unsupported — silently no-op */
  }
}
// Prime the voice list early (some browsers populate it lazily).
if (typeof window !== "undefined" && window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

function SpeakButton({ text, size = 36 }) {
  return (
    <button
      onClick={(e) => { e.stopPropagation(); speakGerman(text); }}
      aria-label={"Hear " + text + " pronounced"}
      title="Hear pronunciation"
      style={{
        flexShrink: 0,
        width: size,
        height: size,
        display: "inline-flex",
        alignItems: "center",
        justifyContent: "center",
        borderRadius: "999px",
        border: "1px solid var(--line)",
        background: "var(--paper-raised)",
        color: "var(--accent)",
        fontSize: Math.round(size * 0.46),
        lineHeight: 1,
        cursor: "pointer",
        boxShadow: "var(--shadow-soft)",
      }}
    >
      🔊
    </button>
  );
}

function CatChip({ cat }) {

  return (

      style={{

}

function FilterBar({ active, onToggle }) {
  return (
    <div style={{ display: "flex", gap: "8px", flexWrap: "wrap", justifyContent: "center" }}>
      {CATS.map((c) => {
        const meta = CATEGORY_META[c];
        const on = active.includes(c);
        return (
          <button
            key={c}
            onClick={() => onToggle(c)}
            style={{
              fontFamily: "var(--font-mono)",
              fontSize: "11px",
              fontWeight: 500,
              letterSpacing: "0.1em",
              textTransform: "uppercase",
              padding: "7px 14px",
              borderRadius: "999px",
              border: `1px solid ${on ? meta.color : meta.color + "66"}`,
              background: on ? meta.color : meta.color + "0d",
              color: on ? "#FCF8EE" : meta.color,
              cursor: "pointer",
              boxShadow: on ? `0 6px 14px -6px ${meta.color}99` : "none",
            }}
          >
            {meta.label}
          </button>
        );
      })}
    </div>
  );
}

// direction: 'de-en' shows German, asks for English. 'en-de' shows English, asks for German.
function promptText(card, direction) {
  return direction === "en-de" ? card.en : card.de;
}
function answerText(card, direction) {
  return direction === "en-de" ? card.de : card.en;
}

// ---------- GEMINI EXAMPLE SENTENCES ----------
// Every card's example sentence is generated by Gemini and then cached forever in
// this browser's localStorage, so each word costs one API call total — after that
// it renders instantly and offline. The API key (Settings) also lives only in
// this browser; nothing is bundled, committed, or sent anywhere but Google.
const GEMINI_MODEL = "gemini-3.6-flash"; // one-line switch if Google retires it

const AI_CACHE_KEY = "a2vocab.aiSentences.v1";
let aiCache = (() => {
  try {
    return JSON.parse(localStorage.getItem(AI_CACHE_KEY)) || {};
  } catch (e) {
    return {};
  }
})();
function cacheAiSentence(word, data) {
  aiCache[word] = data;
  try {
    localStorage.setItem(AI_CACHE_KEY, JSON.stringify(aiCache));
  } catch (e) {
    /* storage full / disabled — sentence just won't survive a reload */
  }
}

async function fetchGeminiSentence(card, apiKey) {
  const catLabel = (CATEGORY_META[card.cat] || {}).label || card.cat;
  const prompt =
    `Write ONE short, natural German example sentence at CEFR A2 level (max 12 words) ` +
    `that uses the German word "${card.de}" (${catLabel}, English meaning: "${card.en}"). ` +
    `Use simple everyday vocabulary and grammar. Then translate that exact sentence to English. ` +
    `Return only JSON: {"de":"<sentence>","en":"<translation>"}.`;
  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(apiKey)}`,
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: {
          responseMimeType: "application/json",
          temperature: 0.7,
        },
      }),
    }
  );
  if (!res.ok) {
    let detail = `HTTP ${res.status}`;
    try {
      const errJson = await res.json();
      detail = (errJson.error && errJson.error.message) || detail;
    } catch (e) {
      /* non-JSON error body */
    }
    throw new Error(detail);
  }
  const data = await res.json();
  const cand = data && data.candidates && data.candidates[0];
  const parts = (cand && cand.content && cand.content.parts) || [];
  // Thinking models can emit a thought part first — take the first part with text.
  const textPart = parts.find((p) => p && typeof p.text === "string" && p.text.trim());
  const text = textPart && textPart.text;
  if (!text) {
    throw new Error(
      cand && cand.finishReason && cand.finishReason !== "STOP"
        ? `no sentence (${cand.finishReason})`
        : "empty response"
    );
  }
  let parsed;
  try {
    parsed = JSON.parse(text);
  } catch (e) {
    // Model ignored the JSON instruction — fall back to the raw text as the sentence.
    parsed = { de: text.replace(/^```(?:json)?|```$/g, "").trim(), en: "" };
  }
  if (!parsed || !parsed.de) throw new Error("unexpected response shape");
  return { de: String(parsed.de).trim(), en: String(parsed.en || "").trim() };
}

function AiSentence({ card, apiKey }) {
  const word = card.de;
  const [state, setState] = useState(() =>
    aiCache[word] ? { status: "done", data: aiCache[word] } : { status: "idle" }
  );

  const run = () => {
    setState({ status: "loading" });
    fetchGeminiSentence(card, apiKey)
      .then((data) => {
        cacheAiSentence(word, data);
        setState({ status: "done", data });
      })
      .catch((err) => setState({ status: "error", message: (err && err.message) || String(err) }));
  };

  // Cached → show at once. Not cached + key present → fetch once, automatically.
  React.useEffect(() => {
    if (aiCache[word]) {
      setState({ status: "done", data: aiCache[word] });
      return;
    }
    if (!apiKey) {
      setState({ status: "idle" });
      return;
    }
    let cancelled = false;
    setState({ status: "loading" });
    fetchGeminiSentence(card, apiKey)
      .then((data) => {
        if (cancelled) return;
        cacheAiSentence(word, data);
        setState({ status: "done", data });
      })
      .catch((err) => {
        if (cancelled) return;
        setState({ status: "error", message: (err && err.message) || String(err) });
      });
    return () => { cancelled = true; };
  }, [word, apiKey]);

  if (state.status === "idle") {
    return (
      <div style={{ fontFamily: "var(--font-mono)", fontSize: "10px", letterSpacing: "0.08em", color: "var(--ink-faint)", textAlign: "center", maxWidth: "min(420px, 90vw)", lineHeight: 1.6 }}>
        add a Gemini API key in settings ▸ for example sentences
      </div>
    );
  }
  if (state.status === "loading") {
    return (
      <div style={{ fontFamily: "var(--font-mono)", fontSize: "11px", letterSpacing: "0.1em", color: "var(--ink-faint)" }}>
        ✨ writing a sentence …
      </div>
    );
  }
  if (state.status === "error") {
    return (
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "6px" }}>
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "11px", color: "#A5354A", maxWidth: "min(420px, 90vw)", textAlign: "center", lineHeight: 1.5 }}>
          Gemini: {state.message}
        </div>
        <button
          onClick={run}

function Flashcards({ pool, allData, direction, noRepeat, onResult, geminiKey }) {
  const [order, setOrder] = useState(() => shuffle(pool.map((d) => d.id)));
  const [idx, setIdx] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [done, setDone] = useState(false);
  const byId = useMemo(() => Object.fromEntries(allData.map((d) => [d.id, d])), [allData]);

  React.useEffect(() => {
    setOrder(shuffle(pool.map((d) => d.id)));
    setIdx(0);
    setFlipped(false);
    setDone(false);
  }, [pool.length, noRepeat]);

  React.useEffect(() => {
    setFlipped(false);
  }, [direction]);

  // Keyboard shortcut for the flashcard flow:
  //   1st Enter → flip the card open (reveal the answer)
  //   2nd Enter → advance to the next card (mirrors the "next ›" button)
  // Ignored while typing in an input/textarea/select so it never fights the
  // Gemini key field or any future text input. The advance branch mirrors
  // next() exactly so noRepeat / done / wrap-around all behave the same as
  // pressing the button.
  React.useEffect(() => {
    const onKey = (e) => {
      if (e.key !== "Enter" || e.isComposing) return;
      const el = e.target;
      if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
      if (done || pool.length === 0) return;
      e.preventDefault();
      if (!flipped) {
        setFlipped(true);
      } else {
        setFlipped(false);
        if (idx + 1 >= order.length) {
          if (noRepeat) setDone(true);
          else setIdx(0);
        } else {
          setIdx((i) => i + 1);
        }
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [flipped, done, idx, order.length, noRepeat, pool.length]);

  if (pool.length === 0) {
    return <p style={{ textAlign: "center", color: "#8a8372" }}>No cards match this filter — pick at least one category above.</p>;
  }

  const restart = () => {
    setOrder(shuffle(pool.map((d) => d.id)));
    setIdx(0);
    setFlipped(false);
    setDone(false);
  };

  if (done) {
    return (
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "16px", padding: "40px 0" }}>
        <div style={{ fontFamily: "var(--font-serif)", fontSize: "22px", color: "#2b2620", textAlign: "center" }}>
          All {order.length} / {order.length} cards done 🎉
        </div>
        <button onClick={restart} style={navBtnStyle}>⟲ start over</button>
      </div>
    );
  }

  const card = byId[order[idx]];
  const front = promptText(card, direction);
  const back = answerText(card, direction);

  const next = () => {
    setFlipped(false);
    if (idx + 1 >= order.length) {
      if (noRepeat) {
        setDone(true);
      } else {
        setIdx(0);
      }
    } else {
      setIdx((i) => i + 1);
    }
  };
  const prev = () => {
    setFlipped(false);
    setIdx((i) => (i - 1 + order.length) % order.length);
  };
  const reshuffle = () => {
    setOrder(shuffle(pool.map((d) => d.id)));
    setIdx(0);
    setFlipped(false);
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "18px" }}>
      <div
        style={{
          fontFamily: "var(--font-mono)",
          fontSize: "12px",
          letterSpacing: "0.1em",
          color: "#8a8372",
        }}
      >
        {noRepeat ? `${idx + 1} / ${order.length} attempted` : `CARD ${idx + 1} / ${order.length}`}
      </div>

      <div
        onClick={() => setFlipped((f) => !f)}
        style={{
          width: "min(440px, 92vw)",
          height: "280px",
          cursor: "pointer",
          perspective: "1400px",
        }}
      >
        <div
          style={{
            position: "relative",
            width: "100%",
            height: "100%",
            transition: "transform 0.55s cubic-bezier(.2,.7,.2,1)",
            transformStyle: "preserve-3d",
            transform: flipped ? "rotateY(180deg)" : "rotateY(0deg)",
          }}
        >
          {/* front */}
          <div
            style={{
              position: "absolute",
              inset: 0,
              backfaceVisibility: "hidden",
              background: "linear-gradient(170deg, #FEFBF3 0%, #F7F1E1 100%)",
              border: "1px solid #e6dcc4",
              borderRadius: "16px",
              boxShadow: "var(--shadow-card)",
              display: "flex",
              flexDirection: "column",
              alignItems: "center",
              justifyContent: "center",
              gap: "18px",
              padding: "28px",
            }}
          >
            <CatChip cat={card.cat} />
            <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "14px" }}>
              {direction === "de-en" && <SpeakButton text={card.de} />}
              <div
                style={{
                  fontFamily: "var(--font-serif)",
                  fontWeight: 600,
                  fontSize: front.length > 28 ? "20px" : front.length > 16 ? "26px" : "34px",
                  lineHeight: 1.25,
                  letterSpacing: "-0.01em",
                  color: "#2b2620",
                  textAlign: "center",
                }}
              >
                {front}
              </div>
            </div>
            <div style={{ fontFamily: "var(--font-mono)", fontSize: "10px", letterSpacing: "0.16em", textTransform: "uppercase", color: "#b0a888" }}>
              tap or ⏎ to reveal
            </div>
          </div>
          {/* back */}
          <div
            style={{
              position: "absolute",
              inset: 0,
              backfaceVisibility: "hidden",
              transform: "rotateY(180deg)",
              background: `linear-gradient(165deg, ${CATEGORY_META[card.cat].color} 0%, ${CATEGORY_META[card.cat].color}e0 100%)`,
              borderRadius: "16px",
              boxShadow: "var(--shadow-card)",
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              padding: "28px",
            }}
          >
            <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "14px" }}>
              {direction === "en-de" && <SpeakButton text={card.de} />}
              <div
                style={{
                  fontFamily: "var(--font-serif)",
                  fontWeight: 600,
                  fontSize: back.length > 28 ? "19px" : "25px",
                  lineHeight: 1.3,
                  letterSpacing: "-0.01em",
                  color: "#FCF8EE",
                  textAlign: "center",
                  textShadow: "0 1px 8px rgba(0,0,0,.18)",
                }}
              >
                {back}
              </div>
            </div>
          </div>
        </div>
      </div>

      <div style={{ display: "flex", gap: "10px" }}>
        <button onClick={prev} style={navBtnStyle}>‹ prev</button>
        <button onClick={reshuffle} style={navBtnStyle}>⟲ shuffle</button>
        <button onClick={next} style={navBtnStyle}>next › <span style={{ opacity: 0.6 }}>⏎</span></button>
      </div>

      {flipped && onResult && (
        <div style={{ display: "flex", gap: "10px" }}>
          <button
            onClick={() => { onResult(card.id, false); next(); }}
            style={{ ...navBtnStyle, background: "transparent", color: "#A5354A", border: "1px solid #A5354A", boxShadow: "none" }}
          >
            ✗ review this
          </button>
          <button
            onClick={() => { onResult(card.id, true); next(); }}
            style={{ ...navBtnStyle, background: "transparent", color: "#3F7A55", border: "1px solid #3F7A55", boxShadow: "none" }}
          >
            ✓ knew it
          </button>
        </div>
      )}

      {flipped && <AiSentence card={card} apiKey={geminiKey} />}
    </div>
  );
}

function StudyMode({ pool, srs, daily, focus, direction, onGrade, geminiKey }) {
  const [queue, setQueue] = useState([]);
  const [i, setI] = useState(0);
  const [graded, setGraded] = useState(0);
  const [sentenceBreak, setSentenceBreak] = useState(null);
  const [round, setRound] = useState(0);
  const seq = React.useRef(0);

  React.useEffect(() => {
    const q = srsQueue(pool, srs, daily, focus).map((c) => Object.assign({}, c, { _qid: ++seq.current }));
    setQueue(q);
    setI(0);
    setGraded(0);
    setSentenceBreak(null);
    // srs/daily read once per round on purpose so the queue doesn't reshuffle mid-session
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [pool.length, focus, round, direction]);

  if (pool.length === 0) {
    return <p style={srsNote}>No categories selected — turn some on in settings ▸.</p>;
  }
  if (queue.length === 0) {
    if (focus === "trouble") {
      return <p style={srsNote}>No trouble words yet — nothing missed {SRS_TROUBLE_LAPSES}+ times. Keep going in <strong>Study</strong> or <strong>Write</strong>. 🎉</p>;
    }
    return (
      <div style={{ ...srsCol, padding: "36px 0" }}>
        <div style={{ fontFamily: "var(--font-serif)", fontSize: "22px", textAlign: "center" }}>You're caught up for today 🎉</div>
        <p style={srsNote}>Every word that's due has been reviewed, and today's {SRS_NEW_PER_DAY} new words are done. Come back tomorrow — or set <strong>focus → everything</strong> in settings ▸ to keep drilling now.</p>
      </div>
    );
  }

  if (i >= queue.length) {
    return (
      <div style={{ ...srsCol, padding: "36px 0" }}>
        <div style={{ fontFamily: "var(--font-serif)", fontSize: "22px", textAlign: "center" }}>{graded} reviewed this round 🎉</div>
        <button onClick={() => setRound((r) => r + 1)} style={navBtnStyle}>⟲ keep going</button>
      </div>
    );
  }

  const card = queue[i];
  const isNew = !srs[srsKey(card)];

  if (sentenceBreak) {
    return (
      <div style={{ ...srsCol, padding: "10px 0" }}>
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "10px", letterSpacing: "0.18em", color: "var(--ink-faint)" }}>SAY IT OUT LOUD</div>
        <div style={{ fontFamily: "var(--font-serif)", fontSize: "20px", textAlign: "center", maxWidth: "min(440px, 92vw)", lineHeight: 1.5 }}>
          Build your own sentence with <strong>{sentenceBreak.de}</strong> — “{sentenceBreak.en}”. Say it aloud, then check yourself against one below.
        </div>
        <AiSentence card={sentenceBreak} apiKey={geminiKey} />
        <button onClick={() => { setSentenceBreak(null); setI((x) => x + 1); }} style={navBtnStyle}>continue ›</button>
      </div>
    );
  }

  const grade = (g) => {
    onGrade(card, g);
    const n = graded + 1;
    setGraded(n);
    if (g === "again") {
      setQueue((qq) => qq.concat([Object.assign({}, card, { _qid: ++seq.current })]));
      setI((x) => x + 1);
    } else if (n % 5 === 0) {
      setSentenceBreak(card);
    } else {
      setI((x) => x + 1);
    }
  };

  return (
    <div style={srsCol}>
      <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", letterSpacing: "0.1em", color: "#8a8372" }}>
        {i + 1} / {queue.length}{focus === "all" ? " · all" : focus === "trouble" ? " · trouble" : ""}
      </div>
      <StudyCard card={card} direction={direction} onGrade={grade} isNew={isNew} geminiKey={geminiKey} />
    </div>
  );
}

function WriteMode({ pool, srs, daily, focus, onGrade, geminiKey }) {
  const [queue, setQueue] = useState([]);
  const [i, setI] = useState(0);
  const [val, setVal] = useState("");
  const [res, setRes] = useState(null);
  const [typed, setTyped] = useState(0);
  const [round, setRound] = useState(0);
  const ref = React.useRef(null);
  const seq = React.useRef(0);

  React.useEffect(() => {
    const q = srsQueue(pool, srs, daily, focus).map((c) => Object.assign({}, c, { _qid: ++seq.current }));
    setQueue(q); setI(0); setVal(""); setRes(null); setTyped(0);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [pool.length, focus, round]);

  React.useEffect(() => {
    if (ref.current && !res) ref.current.focus();
  }, [i, res, queue.length]);

  // Enter always works, even after focus has left the text box: first press
  // checks the answer, the next press moves to the following word.
  const check = () => {
    const c = queue[i];
    if (!c || res) return;
    const r = checkDe(c, val);
    if (r.verdict === "empty") return;
    setRes(r);
    onGrade(c, r.verdict === "correct" ? "good" : "again");
    setTyped((d) => d + 1);
  };
  const advance = () => { setRes(null); setVal(""); setI((x) => x + 1); };
  React.useEffect(() => {
    const onKey = (e) => {
      if (e.key !== "Enter" || e.isComposing) return;
      // Ignore Enter aimed at some other control (a button, the settings key field);
      // only our answer box, or nothing focused, drives the shortcut.
      const el = e.target;
      if (el && el !== ref.current && /^(BUTTON|INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
      if (i >= queue.length) return;
      e.preventDefault();
      if (res) advance(); else check();
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [queue, i, val, res]);

  if (pool.length === 0) {
    return <p style={srsNote}>No categories selected — turn some on in settings ▸.</p>;
  }
  if (queue.length === 0) {
    return <p style={srsNote}>Nothing due to type right now. Set <strong>focus → everything</strong> in settings ▸ to practise producing any word.</p>;
  }
  if (i >= queue.length) {
    return (
      <div style={{ ...srsCol, padding: "36px 0" }}>
        <div style={{ fontFamily: "var(--font-serif)", fontSize: "22px", textAlign: "center" }}>{typed} typed this round 🎉</div>
        <button onClick={() => setRound((r) => r + 1)} style={navBtnStyle}>⟲ keep going</button>
      </div>
    );
  }

  const card = queue[i];
  const isNoun = card.cat === "der" || card.cat === "die" || card.cat === "das";
  const forms = acceptedDe(card);
  const ok = res && res.verdict === "correct";
  const close = res && res.verdict === "close";
  const tone = ok ? "#3F7A55" : close ? "#8A6A2B" : "#A5354A";

  return (
    <div style={srsCol}>
      <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", letterSpacing: "0.1em", color: "#8a8372" }}>
        {i + 1} / {queue.length} · TYPE IT IN GERMAN
      </div>

      <div style={{ textAlign: "center" }}>
        <div style={{ marginBottom: "10px" }}><CatChip cat={card.cat} /></div>
        <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: (card.en || "").length > 26 ? "20px" : "28px", color: "var(--ink)" }}>{card.en}</div>
        {isNoun && !res && (
          <div style={{ fontFamily: "var(--font-mono)", fontSize: "9px", letterSpacing: "0.14em", textTransform: "uppercase", color: "var(--ink-faint)", marginTop: "6px" }}>
            include the article
          </div>
        )}
      </div>

      <input
        ref={ref}
        value={val}
        onChange={(e) => setVal(e.target.value)}
        readOnly={!!res}
        placeholder="dein Deutsch…"
        autoCapitalize="off"
        autoCorrect="off"
        spellCheck={false}
        style={{
          width: "min(440px, 92vw)", padding: "14px 16px", textAlign: "center",
          fontFamily: "var(--font-serif)", fontSize: "20px",
          border: "1px solid " + (res ? tone : "var(--line)"), borderRadius: "12px",
          background: "var(--paper-raised)", color: "var(--ink)", outline: "none",
        }}
      />

      {!res && (
        <React.Fragment>
          <div style={{ display: "flex", gap: "6px" }}>
            {["ä", "ö", "ü", "ß"].map((ch) => (
              <button
                key={ch}
                type="button"
                onMouseDown={(e) => { e.preventDefault(); setVal((v) => v + ch); if (ref.current) ref.current.focus(); }}
                style={{
                  fontFamily: "var(--font-serif)", fontSize: "17px", fontWeight: 600,
                  width: "40px", height: "40px", borderRadius: "9px",
                  border: "1px solid var(--line)", background: "var(--paper-raised)",
                  color: "var(--ink)", cursor: "pointer",
                }}
              >
                {ch}
              </button>
            ))}
          </div>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: "9px", letterSpacing: "0.1em", textTransform: "uppercase", color: "var(--ink-faint)", marginTop: "-6px" }}>
            no umlaut key? tap above — or just type ae / oe / ue / ss
          </div>
          <button onClick={check} style={navBtnStyle}>check › <span style={{ opacity: 0.6 }}>⏎</span></button>
        </React.Fragment>
      )}

      {res && (
        <div style={{ ...srsCol, gap: "10px" }}>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", letterSpacing: "0.08em", color: tone }}>
            {ok ? "✓ RICHTIG" : close ? "≈ FAST" : "✗ NOCH NICHT"}
          </div>
          {!ok && (
            <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "22px", color: "var(--ink)", textAlign: "center" }}>
              {forms.join("  /  ")}
            </div>
          )}
          {ok && res.spelled && (
            <div style={{ fontFamily: "var(--font-serif)", fontSize: "15px", color: "var(--ink-soft)", textAlign: "center" }}>
              accepted — the umlaut spelling is <strong style={{ color: "var(--ink)" }}>{res.spelled}</strong>
            </div>
          )}
          {res.hint && (
            <div style={{ fontFamily: "var(--font-serif)", fontStyle: "italic", fontSize: "14px", color: "var(--ink-soft)", textAlign: "center" }}>{res.hint}</div>
          )}
          <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
            <SpeakButton text={card.de} />
            <button onClick={advance} style={navBtnStyle}>next › <span style={{ opacity: 0.6 }}>⏎</span></button>
          </div>
          <AiSentence card={card} apiKey={geminiKey} />
        </div>
      )}
    </div>
  );
}

function makeQuestion(pool, correctPool) {
  const source = correctPool && correctPool.length > 0 ? correctPool : pool;
  const correct = source[Math.floor(Math.random() * source.length)];
  const sameCat = pool.filter((d) => d.cat === correct.cat && d.id !== correct.id);
  const distractPool = (sameCat.length >= 3 ? sameCat : pool.filter((d) => d.id !== correct.id));
  const distractors = shuffle(distractPool).slice(0, 3);
  const options = shuffle([correct, ...distractors]);
  return { correct, options };
}

function Quiz({ pool, allTime, onAnswer, onResult, sessions, onSaveSession, onClearHistory, direction, noRepeat, geminiKey }) {
  const [askedIds, setAskedIds] = useState(() => new Set());
  const [q, setQ] = useState(() => makeQuestion(pool));
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState({ right: 0, total: 0 });
  const [saved, setSaved] = useState(false);
  const [done, setDone] = useState(false);
  const [historyOpen, setHistoryOpen] = useState(false);

  const resetRound = React.useCallback(() => {
    const fresh = new Set();
    const nq = makeQuestion(pool);
    if (noRepeat) fresh.add(nq.correct.id);
    setAskedIds(fresh);
    setQ(nq);
    setPicked(null);
    setDone(false);
  }, [pool, noRepeat]);

  React.useEffect(() => {
    resetRound();
    setScore({ right: 0, total: 0 });
    setSaved(false);
  }, [pool.length, noRepeat, direction]);

  if (pool.length < 4) {
    return <p style={{ textAlign: "center", color: "#8a8372" }}>Pick at least a couple categories above — need a few options to quiz from.</p>;
  }

  const choose = (opt) => {
    if (picked) return;
    setPicked(opt);
    const correct = opt.id === q.correct.id;
    setScore((s) => ({ right: s.right + (correct ? 1 : 0), total: s.total + 1 }));
    setSaved(false);
    onAnswer && onAnswer(correct);
    onResult && onResult(q.correct.id, correct);
  };

  const nextQ = () => {
    if (noRepeat) {
      const remaining = pool.filter((d) => !askedIds.has(d.id));
      if (remaining.length === 0) {
        setDone(true);
        setPicked(null);
        return;
      }
      const nq = makeQuestion(pool, remaining);
      setAskedIds((prev) => new Set(prev).add(nq.correct.id));
      setQ(nq);
      setPicked(null);
    } else {
      setQ(makeQuestion(pool));
      setPicked(null);
    }
  };

  const finishSession = () => {
    if (score.total === 0) return;
    onSaveSession && onSaveSession(score);
    setSaved(true);
    setScore({ right: 0, total: 0 });
  };

  if (done) {
    return (
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "16px", padding: "40px 0" }}>
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", letterSpacing: "0.1em", color: "#8a8372" }}>
          SCORE {score.right} / {score.total}
        </div>
        <div style={{ fontFamily: "var(--font-serif)", fontSize: "22px", color: "#2b2620", textAlign: "center" }}>
          All {pool.length} / {pool.length} words done 🎉
        </div>
        <div style={{ display: "flex", gap: "10px" }}>
          {score.total > 0 && (
            <button
              onClick={finishSession}
              style={{
                ...navBtnStyle,
                background: saved ? "#3F7A55" : "transparent",
                border: `1px solid ${saved ? "#3F7A55" : "#8a8372"}`,
                color: saved ? "#F6F1E5" : "#8a8372",
              }}
            >
              {saved ? "✓ saved" : "finish & save this round"}
            </button>
          )}
          <button onClick={resetRound} style={navBtnStyle}>⟲ start over</button>
        </div>
      </div>
    );
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "18px" }}>
      <div
        style={{
          fontFamily: "var(--font-mono)",
          fontSize: "12px",
          letterSpacing: "0.1em",
          color: "#8a8372",
        }}
      >
        SCORE {score.right} / {score.total}
        {allTime && allTime.total > 0 && (
          <span style={{ marginLeft: "14px", color: "#b0a888" }}>
            · ALL-TIME {allTime.right} / {allTime.total}
          </span>
        )}
      </div>

      {noRepeat && (
        <div
          style={{
            fontFamily: "var(--font-mono)",
            fontSize: "11px",
            letterSpacing: "0.08em",
            color: "#8a8372",
            marginTop: "-10px",
          }}
        >
          {askedIds.size} / {pool.length} attempted
        </div>
      )}

      <div style={{ textAlign: "center" }}>
        <div style={{ marginBottom: "10px" }}><CatChip cat={q.correct.cat} /></div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "14px", flexWrap: "wrap" }}>
          {direction === "de-en" && <SpeakButton text={q.correct.de} />}
          <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "30px", letterSpacing: "-0.01em", color: "var(--ink)" }}>{promptText(q.correct, direction)}</div>
          {direction === "en-de" && picked && <SpeakButton text={q.correct.de} />}
          {picked && (
            <button onClick={nextQ} style={navBtnStyle}>next ›</button>
          )}
        </div>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: "10px", width: "min(420px, 90vw)" }}>
        {q.options.map((opt) => {
          let bg = "var(--paper-raised)";
          let border = "#e2d8c0";
          let color = "var(--ink)";
          let shadow = "var(--shadow-soft)";
          if (picked) {
            if (opt.id === q.correct.id) {
              bg = "linear-gradient(180deg,#458860,#3F7A55)"; border = "#3F7A55"; color = "#F6F1E5";
              shadow = "0 10px 22px -10px rgba(63,122,85,.7)";
            } else if (opt.id === picked.id) {
              bg = "linear-gradient(180deg,#b23c52,#A5354A)"; border = "#A5354A"; color = "#F6F1E5";
              shadow = "0 10px 22px -10px rgba(165,53,74,.7)";
            } else {
              bg = "transparent"; border = "#e2d8c0"; color = "var(--ink-faint)"; shadow = "none";
            }
          }
          const optText = answerText(opt, direction);
          return (
            <button
              key={opt.id}
              onClick={() => choose(opt)}
              style={{
                textAlign: "left",
                fontFamily: "var(--font-serif)",
                fontWeight: 500,
                fontSize: optText.length > 28 ? "14px" : "17px",
                padding: "14px 18px",
                borderRadius: "12px",
                border: `1px solid ${border}`,
                background: bg,
                color,
                boxShadow: shadow,
                cursor: picked ? "default" : "pointer",
              }}
            >
              {optText}
            </button>
          );
        })}
      </div>

      {picked && <AiSentence card={q.correct} apiKey={geminiKey} />}

      {score.total > 0 && (
        <button
          onClick={finishSession}
          style={{
            ...navBtnStyle,
            background: saved ? "#3F7A55" : "transparent",
            border: `1px solid ${saved ? "#3F7A55" : "#8a8372"}`,
            color: saved ? "#F6F1E5" : "#8a8372",
          }}
        >
          {saved ? "✓ saved" : "finish & save this round"}
        </button>
      )}

      {sessions && sessions.length > 0 && (
        <div style={{ width: "min(420px, 90vw)", marginTop: "10px" }}>
          <div
            style={{
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              gap: "12px",
            }}
          >
            <button
              onClick={() => setHistoryOpen((o) => !o)}
              style={{
                fontFamily: "var(--font-mono)",
                fontSize: "11px",
                letterSpacing: "0.1em",
                color: "#8a8372",
                background: "transparent",
                border: "none",
                padding: 0,
                cursor: "pointer",
              }}
            >
              {historyOpen ? "▾" : "▸"} PAST ROUNDS ({sessions.length})
            </button>
            {historyOpen && onClearHistory && (
              <button
                onClick={() => {
                  if (window.confirm("Clear all saved rounds? This can't be undone.")) onClearHistory();
                }}
                style={{
                  fontFamily: "var(--font-mono)",
                  fontSize: "10px",
                  letterSpacing: "0.08em",
                  textTransform: "uppercase",
                  color: "#A5354A",
                  background: "transparent",
                  border: "1px solid #A5354A",
                  borderRadius: "10px",
                  padding: "2px 8px",
                  cursor: "pointer",
                }}
              >
                clear history
              </button>
            )}
          </div>
          {historyOpen && (
            <div style={{ display: "flex", flexDirection: "column", gap: "6px", marginTop: "10px" }}>
              {sessions.map((s) => {
                const pct = s.total ? Math.round((s.right / s.total) * 100) : 0;
                const d = s.timestamp ? new Date(s.timestamp) : null;
                const dateStr = d
                  ? d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) +
                    " " +
                    d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" })
                  : "";
                return (
                  <div
                    key={s.id}
                    style={{
                      display: "flex",
                      justifyContent: "space-between",
                      fontFamily: "var(--font-mono)",
                      fontSize: "12px",
                      color: "#5a5344",
                      background: "#FBF7EC",
                      border: "1px solid #e4dcc4",
                      borderRadius: "3px",
                      padding: "7px 12px",
                    }}
                  >
                    <span>{dateStr}</span>
                    <span>{s.right}/{s.total} ({pct}%)</span>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

const ARTICLE_OPTIONS = ["der", "die", "das"];
function stripArticle(deText) {
  return deText.replace(/^(der|die|das)\s+/, "");
}
function makeArticleQuestion(nounPool, correctPool) {
  const source = correctPool && correctPool.length > 0 ? correctPool : nounPool;
  const word = source[Math.floor(Math.random() * source.length)];
  return word;
}

function ArticleQuiz({ pool, noRepeat, onResult, geminiKey }) {
  const nounPool = useMemo(() => pool.filter((d) => d.cat === "der" || d.cat === "die" || d.cat === "das"), [pool]);

  const [askedIds, setAskedIds] = useState(() => new Set());
  const [word, setWord] = useState(() => (nounPool.length > 0 ? makeArticleQuestion(nounPool) : null));
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState({ right: 0, total: 0 });
  const [saved, setSaved] = useState(false);
  const [done, setDone] = useState(false);

  const resetRound = React.useCallback(() => {
    if (nounPool.length === 0) return;
    const w = makeArticleQuestion(nounPool);
    const fresh = new Set();
    if (noRepeat) fresh.add(w.id);
    setAskedIds(fresh);
    setWord(w);
    setPicked(null);
    setDone(false);
  }, [nounPool, noRepeat]);

  React.useEffect(() => {
    resetRound();
    setScore({ right: 0, total: 0 });
    setSaved(false);
  }, [nounPool.length, noRepeat]);

  if (nounPool.length === 0) {
    return <p style={{ textAlign: "center", color: "#8a8372" }}>Select at least one of der / die / das above to practice articles.</p>;
  }
  if (!word) return null;

  const choose = (article) => {
    if (picked) return;
    setPicked(article);
    const correct = article === word.cat;
    setScore((s) => ({ right: s.right + (correct ? 1 : 0), total: s.total + 1 }));
    setSaved(false);
    onResult && onResult(word.id, correct);
  };

  const nextQ = () => {
    if (noRepeat) {
      const remaining = nounPool.filter((d) => !askedIds.has(d.id));
      if (remaining.length === 0) {
        setDone(true);
        setPicked(null);
        return;
      }
      const w = makeArticleQuestion(nounPool, remaining);
      setAskedIds((prev) => new Set(prev).add(w.id));
      setWord(w);
      setPicked(null);
    } else {
      setWord(makeArticleQuestion(nounPool));
      setPicked(null);
    }
  };

  if (done) {
    return (
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "16px", padding: "40px 0" }}>
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", letterSpacing: "0.1em", color: "#8a8372" }}>
          SCORE {score.right} / {score.total}
        </div>
        <div style={{ fontFamily: "var(--font-serif)", fontSize: "22px", color: "#2b2620", textAlign: "center" }}>
          All {nounPool.length} / {nounPool.length} nouns done 🎉
        </div>
        <button onClick={resetRound} style={navBtnStyle}>⟲ start over</button>
      </div>
    );
  }

  const bare = stripArticle(word.de);

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "18px" }}>
      <div
        style={{
          fontFamily: "var(--font-mono)",
          fontSize: "12px",
          letterSpacing: "0.1em",
          color: "#8a8372",
        }}
      >
        SCORE {score.right} / {score.total}
      </div>

      {noRepeat && (
        <div
          style={{
            fontFamily: "var(--font-mono)",
            fontSize: "11px",
            letterSpacing: "0.08em",
            color: "#8a8372",
            marginTop: "-10px",
          }}
        >
          {askedIds.size} / {nounPool.length} attempted
        </div>
      )}

      <div style={{ textAlign: "center" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "14px", flexWrap: "wrap" }}>
          <SpeakButton text={picked ? word.de : bare} />
          <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "34px", letterSpacing: "-0.01em", color: "var(--ink)" }}>{bare}</div>
          {picked && (
            <button onClick={nextQ} style={navBtnStyle}>next ›</button>
          )}
        </div>
        <div style={{ fontFamily: "var(--font-serif)", fontStyle: "italic", fontSize: "15px", color: "var(--ink-soft)", marginTop: "8px" }}>{word.en}</div>
      </div>

      <div style={{ display: "flex", gap: "12px" }}>
        {ARTICLE_OPTIONS.map((art) => {
          const meta = CATEGORY_META[art];
          let bg = meta.color + "0d";
          let color = meta.color;
          let shadow = "none";
          if (picked) {
            if (art === word.cat) { bg = meta.color; color = "#FCF8EE"; shadow = `0 10px 24px -10px ${meta.color}`; }
            else if (art === picked && picked !== word.cat) { bg = "#A5354A"; color = "#FCF8EE"; shadow = "0 10px 24px -10px #A5354A"; }
            else { bg = "transparent"; color = "var(--ink-faint)"; }
          }
          return (
            <button
              key={art}
              onClick={() => choose(art)}
              style={{
                fontFamily: "var(--font-serif)",
                fontWeight: 600,
                fontSize: "21px",
                padding: "14px 30px",
                borderRadius: "12px",
                border: `1.5px solid ${picked && art === word.cat ? meta.color : picked && art === picked ? "#A5354A" : meta.color + "66"}`,
                background: bg,
                color,
                boxShadow: shadow,
                cursor: picked ? "default" : "pointer",
              }}
            >
              {art}
            </button>
          );
        })}
      </div>

      {picked && <AiSentence card={word} apiKey={geminiKey} />}
    </div>
  );
}

// ---------- FILL-IN-THE-BLANK (cloze) ----------
// Uses the hand-written example sentence on each noun card, blanks out the noun,
// and offers 4 same-gender nouns to choose from. Only nouns carry example
// sentences in the data, so this mode works off der / die / das.
const NOUN_CATS = ["der", "die", "das"];
function nounForms(card) {
  let de = String(card.de || "").replace(/\s*\((?:Pl\.|WG)\)/g, "").trim();
  return de
    .split(" / ")
    .map((s) => s.replace(/^(der|die|das)\s+/i, "").trim())
    .filter(Boolean);
}
function clozeMatch(card) {
  const sentence = String(card.example || "");
  if (!sentence) return null;
  for (const f of nounForms(card)) {
    const esc = f.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const m = sentence.match(new RegExp(esc, "i"));
    if (m) {
      return {
        answer: m[0],
        before: sentence.slice(0, m.index),
        after: sentence.slice(m.index + m[0].length),
      };
    }
  }
  return null;
}
function makeClozeQuestion(pool, correctPool) {
  const source = correctPool && correctPool.length > 0 ? correctPool : pool;
  const correct = source[Math.floor(Math.random() * source.length)];
  const hit = clozeMatch(correct);
  const sameCat = pool.filter((d) => d.cat === correct.cat && d.id !== correct.id);
  const distractPool = sameCat.length >= 3 ? sameCat : pool.filter((d) => d.id !== correct.id);
  const distractors = shuffle(distractPool).slice(0, 3);
  const options = shuffle([correct, ...distractors]).map((d) => ({ id: d.id, label: nounForms(d)[0] }));
  return { correct, hit, options };
}

function ClozeQuiz({ pool, noRepeat, onResult, geminiKey }) {
  const clozePool = useMemo(
    () => pool.filter((d) => NOUN_CATS.includes(d.cat) && d.example && clozeMatch(d)),
    [pool]
  );

  const [askedIds, setAskedIds] = useState(() => new Set());
  const [q, setQ] = useState(() => (clozePool.length > 0 ? makeClozeQuestion(clozePool) : null));
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState({ right: 0, total: 0 });
  const [done, setDone] = useState(false);

  const resetRound = React.useCallback(() => {
    if (clozePool.length === 0) return;
    const nq = makeClozeQuestion(clozePool);
    const fresh = new Set();
    if (noRepeat) fresh.add(nq.correct.id);
    setAskedIds(fresh);
    setQ(nq);
    setPicked(null);
    setDone(false);
  }, [clozePool, noRepeat]);

  React.useEffect(() => {
    resetRound();
    setScore({ right: 0, total: 0 });
  }, [clozePool.length, noRepeat]);

  if (clozePool.length < 4) {
    return (
      <p style={{ textAlign: "center", color: "var(--ink-soft)", maxWidth: "min(440px, 92vw)", margin: "0 auto", lineHeight: 1.6 }}>
        Fill-in-the-blank runs on example sentences — select <strong>der / die / das</strong> above (and enough nouns) to play.
      </p>
    );
  }
  if (!q) return null;

  const choose = (optId) => {
    if (picked) return;
    setPicked(optId);
    const correct = optId === q.correct.id;
    setScore((s) => ({ right: s.right + (correct ? 1 : 0), total: s.total + 1 }));
    onResult && onResult(q.correct.id, correct);
  };

  const nextQ = () => {
    if (noRepeat) {
      const remaining = clozePool.filter((d) => !askedIds.has(d.id));
      if (remaining.length === 0) {
        setDone(true);
        setPicked(null);
        return;
      }
      const nq = makeClozeQuestion(clozePool, remaining);
      setAskedIds((prev) => new Set(prev).add(nq.correct.id));
      setQ(nq);
      setPicked(null);
    } else {
      setQ(makeClozeQuestion(clozePool));
      setPicked(null);
    }
  };

  if (done) {
    return (
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "16px", padding: "40px 0" }}>
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", letterSpacing: "0.1em", color: "var(--ink-faint)" }}>
          SCORE {score.right} / {score.total}
        </div>
        <div style={{ fontFamily: "var(--font-serif)", fontSize: "22px", color: "var(--ink)", textAlign: "center" }}>
          All {clozePool.length} / {clozePool.length} sentences done 🎉
        </div>
        <button onClick={resetRound} style={navBtnStyle}>⟲ start over</button>
      </div>
    );
  }

  const accent = CATEGORY_META[q.correct.cat].color;

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "18px" }}>
      <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", letterSpacing: "0.1em", color: "var(--ink-faint)" }}>
        SCORE {score.right} / {score.total}
      </div>

      {noRepeat && (
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "11px", letterSpacing: "0.08em", color: "var(--ink-faint)", marginTop: "-10px" }}>
          {askedIds.size} / {clozePool.length} attempted
        </div>
      )}

      <div
        style={{
          position: "relative",
          width: "min(440px, 92vw)",
          background: "linear-gradient(170deg, #FEFBF3 0%, #F7F1E1 100%)",
          border: "1px solid #e6dcc4",
          borderRadius: "16px",
          boxShadow: "var(--shadow-card)",
          padding: "26px 22px",
          textAlign: "center",
        }}
      >
        {picked && (
          <button
            onClick={nextQ}
            aria-label="next question"
            style={{
              ...navBtnStyle,
              position: "absolute",
              right: "14px",
              top: "18px",
              zIndex: 5,
              padding: "8px 14px",
              fontSize: "11px",
              borderRadius: "999px",
              boxShadow: "0 8px 20px -6px rgba(60,50,20,.7)",
            }}
          >
            next ›
          </button>
        )}
        <div style={{ marginBottom: "16px" }}><CatChip cat={q.correct.cat} /></div>
        <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "21px", lineHeight: 1.7, color: "var(--ink)" }}>
          {q.hit.before}
          <span
            style={{
              display: "inline-block",
              minWidth: "84px",
              margin: "0 4px",
              padding: "0 8px 2px",
              borderBottom: `2px solid ${picked ? accent : "var(--ink-faint)"}`,
              color: picked ? accent : "transparent",
              fontWeight: 700,
            }}
          >
            {picked ? q.hit.answer : " "}
          </span>
          {q.hit.after}
        </div>
        {picked && (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "12px", marginTop: "14px" }}>
            <SpeakButton text={(q.hit.before + q.hit.answer + q.hit.after).trim() || q.correct.de} size={30} />
            <div style={{ fontFamily: "var(--font-serif)", fontStyle: "italic", fontSize: "14px", color: "var(--ink-soft)" }}>
              {q.correct.de} · {q.correct.en}
            </div>
          </div>
        )}
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: "10px", width: "min(440px, 92vw)" }}>
        {q.options.map((opt) => {
          let bg = "var(--paper-raised)";
          let border = "#e2d8c0";
          let color = "var(--ink)";
          let shadow = "var(--shadow-soft)";
          if (picked) {
            if (opt.id === q.correct.id) {
              bg = "linear-gradient(180deg,#458860,#3F7A55)"; border = "#3F7A55"; color = "#FCF8EE";
              shadow = "0 10px 22px -10px rgba(63,122,85,.7)";

              bg = "linear-gradient(180deg,#b23c52,#A5354A)"; border = "#A5354A"; color = "#FCF8EE";
              shadow = "0 10px 22px -10px rgba(165,53,74,.7)";
            } else {
              bg = "transparent"; border = "#e2d8c0"; color = "var(--ink-faint)"; shadow = "none";
            }
          }
          return (
            <button
              key={opt.id}
              onClick={() => choose(opt.id)}
              style={{
                fontFamily: "var(--font-serif)",
                fontWeight: 600,
                fontSize: opt.label.length > 22 ? "15px" : "18px",
                textAlign: "center",
                padding: "14px 16px",
                borderRadius: "12px",
                border: `1px solid ${border}`,
                background: bg,
                color,
                boxShadow: shadow,
                cursor: picked ? "default" : "pointer",
              }}
            >
              {opt.label}
            </button>
          );
        })}
      </div>

      {picked && <AiSentence card={q.correct} apiKey={geminiKey} />}
    </div>
  );
}

// ---------- REVIEW (re-test past mistakes) ----------
// Drills the words in `mistakes` — anything missed in Quiz / Articles / Fill-in,
// or flagged with "✗ review this" on a flashcard. Same 4-option meaning test as
// Quiz. Nothing ever leaves the list on its own: a word stays until you remove
// it yourself (per word, or "clear whole list"), so you can revise as long as
// you like. The list ignores the level / category filters so mistakes never
// silently disappear from view.
function MistakesReview({ mistakes, allData, direction, onResult, onRemove, onClearAll, geminiKey }) {
  const byId = useMemo(() => Object.fromEntries(allData.map((d) => [d.id, d])), [allData]);

  // Snapshot the list at mount (the tab remounts on every switch via key={mode}),
  // so clearing a word mid-round doesn't reshuffle the remaining questions.
  const [queue, setQueue] = useState(() =>
    shuffle(Object.keys(mistakes).map(Number).filter((id) => byId[id]))
  );
  const [pos, setPos] = useState(0);
  const [picked, setPicked] = useState(null);
  const [results, setResults] = useState({});
  const [roundKey, setRoundKey] = useState(0);

  const startRound = React.useCallback(
    (ids) => {
      const base = (ids && ids.length ? ids : Object.keys(mistakes).map(Number)).filter((id) => byId[id]);
      setQueue(shuffle(base));
      setPos(0);
      setPicked(null);
      setResults({});
      setRoundKey((k) => k + 1);
    },
    [mistakes, byId]
  );

  const card = byId[queue[pos]];
  const options = useMemo(() => {
    if (!card) return [];
    const sameCat = allData.filter((d) => d.cat === card.cat && d.id !== card.id);
    const distractPool = sameCat.length >= 3 ? sameCat : allData.filter((d) => d.id !== card.id);
    return shuffle([card, ...shuffle(distractPool).slice(0, 3)]);
  }, [card, allData, pos, roundKey]);

  const total = Object.keys(mistakes).length;

  if (total === 0) {
    return (
      <p style={{ textAlign: "center", color: "var(--ink-soft)", maxWidth: "min(440px, 92vw)", margin: "0 auto", lineHeight: 1.7 }}>
        Nothing to review yet. Words you miss in <strong>Quiz</strong>, <strong>Articles</strong>, <strong>Fill-in</strong> or <strong>Trennbare Verben</strong> — or flag with <strong>✗&nbsp;review&nbsp;this</strong> on a card — collect here and stay until <em>you</em> take them off. Revise them as often as you like.
      </p>
    );
  }

  const done = pos >= queue.length;
  if (done) {
    const answered = Object.keys(results).length;
    const gotRight = Object.values(results).filter(Boolean).length;
    const missedThisRound = queue.filter((id) => results[id] === false && mistakes[id]);
    return (
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "16px", padding: "32px 0" }}>
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", letterSpacing: "0.1em", color: "var(--ink-faint)" }}>
          THIS ROUND {gotRight} / {answered} right
        </div>
        <div style={{ fontFamily: "var(--font-serif)", fontSize: "22px", color: "var(--ink)", textAlign: "center" }}>
          {`${total} word${total === 1 ? "" : "s"} on the list`}
        </div>
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "10px", letterSpacing: "0.08em", color: "var(--ink-faint)", textAlign: "center", maxWidth: "min(420px, 90vw)", lineHeight: 1.6 }}>
          words stay here until you take them off — revise as long as you like
        </div>
        <div style={{ display: "flex", gap: "10px", flexWrap: "wrap", justifyContent: "center" }}>
          {missedThisRound.length > 0 && (
            <button onClick={() => startRound(missedThisRound)} style={navBtnStyle}>↻ redo the {missedThisRound.length} I missed</button>
          )}
          <button onClick={() => startRound()} style={navBtnStyle}>⟲ review all {total}</button>
        </div>
      </div>
    );
  }

  if (!card) {
    return (
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "16px", padding: "32px 0" }}>
        <button onClick={() => startRound()} style={navBtnStyle}>⟲ restart review</button>
      </div>
    );
  }

  const choose = (opt) => {
    if (picked) return;
    setPicked(opt);
    const correct = opt.id === card.id;
    setResults((r) => ({ ...r, [card.id]: correct }));
    onResult && onResult(card.id, correct);
  };
  const next = () => {
    setPicked(null);
    setPos((p) => p + 1);
  };

  const info = mistakes[card.id] || {};

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "18px" }}>
      <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", letterSpacing: "0.1em", color: "var(--ink-faint)" }}>
        REVIEW {pos + 1} / {queue.length}
        <span style={{ marginLeft: "14px", color: "#b0a888" }}>· {total} on list</span>
      </div>

      <div style={{ textAlign: "center" }}>
        <div style={{ marginBottom: "10px" }}><CatChip cat={card.cat} /></div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "14px", flexWrap: "wrap" }}>
          {direction === "de-en" && <SpeakButton text={card.de} />}
          <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "30px", letterSpacing: "-0.01em", color: "var(--ink)" }}>
            {promptText(card, direction)}
          </div>
          {direction === "en-de" && picked && <SpeakButton text={card.de} />}
          {picked && <button onClick={next} style={navBtnStyle}>next ›</button>}
        </div>
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "10px", letterSpacing: "0.12em", textTransform: "uppercase", color: "var(--ink-faint)", marginTop: "10px" }}>
          {info.wrong ? `missed ${info.wrong}×` : "flagged"}{info.right ? `  ·  got it ${info.right}×` : ""}
        </div>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: "10px", width: "min(420px, 90vw)" }}>
        {options.map((opt) => {
          let bg = "var(--paper-raised)";
          let border = "#e2d8c0";
          let color = "var(--ink)";
          let shadow = "var(--shadow-soft)";
          if (picked) {
            if (opt.id === card.id) {
              bg = "linear-gradient(180deg,#458860,#3F7A55)"; border = "#3F7A55"; color = "#F6F1E5";
              shadow = "0 10px 22px -10px rgba(63,122,85,.7)";
            } else if (opt.id === picked.id) {
              bg = "linear-gradient(180deg,#b23c52,#A5354A)"; border = "#A5354A"; color = "#F6F1E5";
              shadow = "0 10px 22px -10px rgba(165,53,74,.7)";
            } else {
              bg = "transparent"; border = "#e2d8c0"; color = "var(--ink-faint)"; shadow = "none";
            }
          }
          const optText = answerText(opt, direction);
          return (
            <button
              key={opt.id}
              onClick={() => choose(opt)}
              style={{
                textAlign: "left",
                fontFamily: "var(--font-serif)",
                fontWeight: 500,
                fontSize: optText.length > 28 ? "14px" : "17px",
                padding: "14px 18px",
                borderRadius: "12px",
                border: `1px solid ${border}`,
                background: bg,
                color,
                boxShadow: shadow,
                cursor: picked ? "default" : "pointer",
              }}
            >
              {optText}
            </button>
          );
        })}
      </div>

      {picked && <AiSentence card={card} apiKey={geminiKey} />}

      {picked && (
        <button
          onClick={() => { onRemove && onRemove(card.id); next(); }}
          style={{
            ...navBtnStyle,
            background: "transparent", color: "#3F7A55", border: "1px solid #3F7A55", boxShadow: "none",
          }}
        >
          ✓ I know this — take it off the list
        </button>
      )}

      <div style={{ display: "flex", gap: "10px", flexWrap: "wrap", justifyContent: "center", marginTop: "6px" }}>
        <button
          onClick={() => startRound()}
          style={{
            fontFamily: "var(--font-mono)", fontSize: "10px", letterSpacing: "0.08em", textTransform: "uppercase",
            color: "var(--ink-soft)", background: "transparent", border: "1px solid var(--line)", borderRadius: "10px",
            padding: "4px 10px", cursor: "pointer",
          }}
        >
          ⟲ reshuffle round
        </button>
        <button
          onClick={() => {
            if (window.confirm(`Clear all ${total} words from the review list? This can't be undone.`)) onClearAll();
          }}
          style={{
            fontFamily: "var(--font-mono)", fontSize: "10px", letterSpacing: "0.08em", textTransform: "uppercase",
            color: "#A5354A", background: "transparent", border: "1px solid #A5354A", borderRadius: "10px",
            padding: "4px 10px", cursor: "pointer",
          }}
        >
          clear whole list
        </button>
      </div>
    </div>
  );
}

// ---------- TRENNBARE VERBEN (separable verbs) ----------
// Drills the mechanic that trips learners up: the separable prefix jumps to the
// end of the clause. We show the sentence with the prefix blanked out and ask
// which prefix belongs there.
const SEP_PREFIXES = [
  "auf", "an", "aus", "ein", "mit", "nach", "vor", "zu", "ab", "um",
  "zurück", "weg", "hin", "her", "fest", "los", "teil", "statt", "durch",
  "heraus", "zusammen", "vorbei", "fern", "bei", "mit",
];
const SEP_COMMON = ["auf", "an", "aus", "ein", "mit", "nach", "vor", "zu", "ab", "um"];

function sepParts(card) {
  let de = String(card.de || "").trim();
  de = de.replace(/^sich\s+/i, "").replace(/\s+(mit|auf|an|über|für|zu|nach|von|in|bei|um)$/i, "").trim();
  const inf = de.split(" ")[0] || de;
  const prefix = String(
    card.prefix || SEP_PREFIXES.find((p) => inf.toLowerCase().startsWith(p)) || ""
  ).toLowerCase();
  return { inf, prefix };
}

function sepCloze(card, prefix) {
  const ex = String(card.example || "").trim();
  if (!ex || !prefix) return null;
  const esc = prefix.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const re = new RegExp("(^|[\\s(])(" + esc + ")(?=[\\s.,!?;:)]|$)", "gi");
  let m, last = null;
  while ((m = re.exec(ex))) last = m;
  if (!last) return null;
  const at = last.index + last[1].length;
  return { before: ex.slice(0, at), after: ex.slice(at + prefix.length), answer: ex.substr(at, prefix.length) };
}

function makeSepQuestion(playable, avoidId) {
  if (!playable || playable.length === 0) return null;
  const src = playable.length > 1 && avoidId != null ? playable.filter((d) => d.id !== avoidId) : playable;
  const card = src[Math.floor(Math.random() * src.length)];
  const { prefix } = sepParts(card);
  const cloze = sepCloze(card, prefix);
  const distractors = shuffle(SEP_COMMON.filter((p) => p !== prefix)).slice(0, 3);
  const options = shuffle([prefix, ...distractors]);
  return { card, answer: prefix, cloze, options };
}

function SeparableVerbs({ pool, onResult, geminiKey }) {
  const playable = useMemo(() => {
    return pool.filter((d) => {
      if (d.cat !== "sep") return false;
      const { prefix } = sepParts(d);
      return prefix && sepCloze(d, prefix);
    });
  }, [pool]);

  const [q, setQ] = useState(() => makeSepQuestion(playable));
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState({ right: 0, total: 0 });

  React.useEffect(() => {
    setQ(makeSepQuestion(playable));
    setPicked(null);
    setScore({ right: 0, total: 0 });
  }, [playable.length]);

  if (playable.length < 4) {
    return (
      <p style={{ textAlign: "center", color: "var(--ink-soft)", maxWidth: "min(440px, 92vw)", margin: "0 auto", lineHeight: 1.7 }}>
        Not enough separable verbs in the current selection — turn on the <strong>trenn.</strong> category (and a level or two) in settings ▸.
      </p>
    );
  }
  if (!q || !q.cloze) return null;

  const { inf } = sepParts(q.card);

  const choose = (opt) => {
    if (picked) return;
    setPicked(opt);
    const correct = opt === q.answer;
    setScore((s) => ({ right: s.right + (correct ? 1 : 0), total: s.total + 1 }));
    onResult && onResult(q.card.id, correct);
  };
  const nextQ = () => {
    setQ(makeSepQuestion(playable, q.card.id));
    setPicked(null);
  };

  const accent = CATEGORY_META.sep.color;

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "18px" }}>
      <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", letterSpacing: "0.1em", color: "var(--ink-faint)" }}>
        SCORE {score.right} / {score.total}
        <span style={{ marginLeft: "12px", color: "#b0a888" }}>· {playable.length} verbs</span>
      </div>

      <div
        style={{
          position: "relative",
          width: "min(440px, 92vw)",
          background: "linear-gradient(170deg, #FEFBF3 0%, #F7F1E1 100%)",
          border: "1px solid #e6dcc4",
          borderRadius: "16px",
          boxShadow: "var(--shadow-card)",
          padding: "26px 22px",
          textAlign: "center",
        }}
      >
        {picked && (
          <button
            onClick={nextQ}
            aria-label="next question"
            style={{
              ...navBtnStyle,
              position: "absolute", right: "14px", top: "18px", zIndex: 5,
              padding: "8px 14px", fontSize: "11px", borderRadius: "999px",
              boxShadow: "0 8px 20px -6px rgba(60,50,20,.7)",
            }}
          >
            next ›
          </button>
        )}
        <div style={{ marginBottom: "14px" }}><CatChip cat="sep" /></div>
        <div style={{ fontFamily: "var(--font-serif)", fontStyle: "italic", fontSize: "15px", color: "var(--ink-soft)", marginBottom: "12px" }}>
          {picked ? `${inf} — ${q.card.en}` : q.card.en}
        </div>
        <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "21px", lineHeight: 1.7, color: "var(--ink)" }}>
          {q.cloze.before}
          <span
            style={{
              display: "inline-block", minWidth: "68px", margin: "0 4px", padding: "0 8px 2px",
              borderBottom: `2px solid ${picked ? accent : "var(--ink-faint)"}`,
              color: picked ? accent : "transparent", fontWeight: 700,
            }}
          >
            {picked ? q.cloze.answer : " "}
          </span>
          {q.cloze.after}
        </div>
        {picked && (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "12px", marginTop: "14px" }}>
            <SpeakButton text={(q.cloze.before + q.cloze.answer + q.cloze.after).trim() || q.card.example} size={30} />
            <div style={{ fontFamily: "var(--font-mono)", fontSize: "10px", letterSpacing: "0.12em", textTransform: "uppercase", color: picked === q.answer ? "#3F7A55" : "#A5354A" }}>
              {picked === q.answer ? "richtig" : `→ ${q.answer}`}
            </div>
          </div>
        )}
      </div>

      <div style={{ fontFamily: "var(--font-mono)", fontSize: "10px", letterSpacing: "0.12em", textTransform: "uppercase", color: "var(--ink-faint)" }}>
        which prefix goes in the gap?
      </div>

      <div style={{ display: "flex", gap: "10px", flexWrap: "wrap", justifyContent: "center", width: "min(440px, 92vw)" }}>
        {q.options.map((opt) => {
          const meta = CATEGORY_META.sep;
          let bg = meta.color + "0d";
          let color = meta.color;
          let border = meta.color + "66";
          let shadow = "none";
          if (picked) {
            if (opt === q.answer) { bg = meta.color; color = "#FCF8EE"; border = meta.color; shadow = `0 10px 24px -10px ${meta.color}`; }
            else if (opt === picked) { bg = "#A5354A"; color = "#FCF8EE"; border = "#A5354A"; shadow = "0 10px 24px -10px #A5354A"; }
            else { bg = "transparent"; color = "var(--ink-faint)"; border = "#e2d8c0"; }
          }
          return (
            <button
              key={opt}
              onClick={() => choose(opt)}
              style={{
                fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "19px",
                padding: "12px 24px", borderRadius: "12px",
                border: `1.5px solid ${border}`, background: bg, color, boxShadow: shadow,
                cursor: picked ? "default" : "pointer",
              }}
            >
              {opt}
            </button>
          );
        })}
      </div>

      {picked && <AiSentence card={q.card} apiKey={geminiKey} />}
    </div>
  );
}

// ---------- MUSTER (sentence-pattern viewer) ----------
// Not an exercise — a viewer. Each German sentence pattern is shown as a row of
// colour-coded slots (Position ①, Verb ②, Satzende, Konjunktion, …). You pick a
// pattern and scroll through several real A2 sentences that ALL take the same
// shape, so the word-order rule becomes something you recognise rather than
// something you compute. Nothing to type, nothing scored. 🔊 reads each aloud.
const CHUNK_ROLE = {
  front:  { bd: "#3A5A8C", fg: "#2b2620", bg: "#3A5A8C14", cap: "Position ①" },
  v2:     { bd: "#8A6A2B", fg: "#FCF8EE", bg: "#8A6A2B",   cap: "Verb ②" },
  end:    { bd: "#3F7A55", fg: "#FCF8EE", bg: "#3F7A55",   cap: "Satzende" },
  konj:   { bd: "#6B4A8A", fg: "#6B4A8A", bg: "#6B4A8A12", cap: "Konjunktion" },
  subj:   { bd: "var(--line)", fg: "var(--ink)", bg: "var(--paper-raised)", cap: "Subjekt" },
  time:   { bd: "var(--line)", fg: "var(--ink)", bg: "var(--paper-raised)", cap: "Zeit" },
  place:  { bd: "var(--line)", fg: "var(--ink)", bg: "var(--paper-raised)", cap: "Ort" },
  obj:    { bd: "var(--line)", fg: "var(--ink)", bg: "var(--paper-raised)", cap: "Objekt" },
  manner: { bd: "var(--line)", fg: "var(--ink)", bg: "var(--paper-raised)", cap: "Art & Weise" },
  mid:    { bd: "var(--line)", fg: "var(--ink-soft)", bg: "transparent", cap: "" },
};

function ChunkRow({ chunks, big }) {
  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: "6px", justifyContent: "center", alignItems: "flex-end" }}>
      {chunks.map((ch, i) => {
        const m = CHUNK_ROLE[ch[1]] || CHUNK_ROLE.mid;
        const cap = ch[2] != null ? ch[2] : m.cap;
        const strong = ch[1] === "v2" || ch[1] === "end";
        return (
          <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "3px" }}>
            <div style={{
              fontFamily: "var(--font-serif)", fontSize: big ? "16px" : "14px",
              fontWeight: strong ? 700 : 500, padding: "6px 10px", borderRadius: "8px", lineHeight: 1.15,
              border: "1px solid " + m.bd, background: m.bg, color: m.fg,
            }}>
              {ch[0]}
            </div>
            <div style={{ fontFamily: "var(--font-mono)", fontSize: "7.5px", letterSpacing: "0.05em", textTransform: "uppercase", color: "var(--ink-faint)", minHeight: "9px", textAlign: "center" }}>
              {cap}
            </div>
          </div>
        );
      })}
    </div>
  );
}
