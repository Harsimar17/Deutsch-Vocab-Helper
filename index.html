      {tip && <WordTip tip={tip} />}
    </div>
  );
}

function StoriesTab({ stories, allData }) {
  const [prefs, setPrefs] = useState(() => srsLoad(STORY_PREFS_KEY, { open: null, showEn: false }));
  const [read, setRead] = useState(() => srsLoad(STORY_READ_KEY, {}));
  React.useEffect(() => { srsSave(STORY_PREFS_KEY, prefs); }, [prefs]);
  React.useEffect(() => { srsSave(STORY_READ_KEY, read); }, [read]);

  const items = (stories && stories.items) || [];
  const byId = useMemo(() => Object.fromEntries(items.map((s) => [s.id, s])), [items]);

  // Phase groups in the order the file defines; anything unlisted goes last.
  const groups = useMemo(() => {
    const seen = new Set();
    const out = ((stories && stories.phases) || []).map((p) => {
      const list = (p.chapter_ids || []).map((id) => byId[id]).filter(Boolean);
      list.forEach((s) => seen.add(s.id));
      return { phase: p, list };
    });
    const rest = items.filter((s) => !seen.has(s.id)).sort((a, b) => (a.chapter || 0) - (b.chapter || 0));
    if (rest.length) out.push({ phase: { name: "Weitere Geschichten" }, list: rest });
    return out.filter((g) => g.list.length);
  }, [stories, items, byId]);
  const flat = useMemo(() => groups.reduce((a, g) => a.concat(g.list), []), [groups]);

  // Every glossary from every story first, then all vocab cards (A1 → B1).
  const globalDict = useMemo(() => {
    const d = makeGlossDict();
    items.forEach((s) => addGlossary(d, s.glossary));
    (allData || []).forEach((c) => d.add(c.de, c.en, c.cat, c.lvl, c.example, c.cat === "verb" || c.cat === "sep"));
    return d;
  }, [items, allData]);

  if (!items.length) {
    return (
      <p style={srsNote}>
        No stories found — german_vocab.json needs a <code>stories</code> block with an <code>items</code> list.
      </p>
    );
  }

  const open = prefs.open != null ? byId[prefs.open] : null;
  const setOpen = (id) => setPrefs((p) => Object.assign({}, p, { open: id }));

  if (open) {
    const i = flat.findIndex((s) => s.id === open.id);
    return (
      <StoryReader
        story={open}
        globalDict={globalDict}
        showEn={!!prefs.showEn}
        onShowEn={(v) => setPrefs((p) => Object.assign({}, p, { showEn: v }))}
        isRead={!!read[open.id]}
        onToggleRead={() => setRead((r) => {
          const nr = Object.assign({}, r);
          if (nr[open.id]) delete nr[open.id]; else nr[open.id] = Date.now();
          return nr;
        })}
        prev={i > 0 ? flat[i - 1] : null}
        next={i >= 0 && i < flat.length - 1 ? flat[i + 1] : null}
        onOpen={setOpen}
        onBack={() => setOpen(null)}
      />
    );
  }

  const readCount = items.filter((s) => read[s.id]).length;
  return (
    <div style={{ ...srsCol, width: "100%", maxWidth: "560px", margin: "0 auto", alignItems: "stretch", gap: "22px" }}>
      <div style={{ textAlign: "center" }}>
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "10px", fontWeight: 500, letterSpacing: "0.28em", color: "var(--accent)", marginBottom: "8px" }}>
          {stories.level || "B1"} · LESEN
        </div>
        <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "30px", color: "var(--ink)", letterSpacing: "-0.01em" }}>Geschichten</div>
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "10px", letterSpacing: "0.12em", textTransform: "uppercase", color: "var(--ink-soft)", marginTop: "8px" }}>
          {readCount} / {items.length} gelesen
        </div>
      </div>
      {groups.map((g, gi) => (
        <div key={gi} style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
          <div>
            <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "18px", color: "var(--ink)" }}>{g.phase.name}</div>
            {g.phase.description && <div style={{ fontFamily: "var(--font-serif)", fontStyle: "italic", fontSize: "13px", color: "var(--ink-soft)" }}>{g.phase.description}</div>}
            {g.phase.note && <div style={{ fontFamily: "var(--font-serif)", fontSize: "13px", color: "var(--ink-faint)", marginTop: "4px", lineHeight: 1.5 }}>{g.phase.note}</div>}
          </div>
          {g.list.map((s) => (
            <button
              key={s.id}
              onClick={() => setOpen(s.id)}
              style={{
                display: "flex", alignItems: "center", gap: "12px", textAlign: "left", width: "100%",
                padding: "12px 14px", borderRadius: "12px", border: "1px solid " + (read[s.id] ? "var(--good-soft)" : "var(--line-card)"),
                background: "var(--paper-raised)", boxShadow: "var(--shadow-soft)", cursor: "pointer", color: "var(--ink)",
              }}
            >
              <span style={{ flexShrink: 0, width: "34px", fontFamily: "var(--font-mono)", fontSize: "11px", color: "var(--ink-faint)" }}>{String(s.chapter).padStart(2, "0")}</span>
              <span style={{ flex: 1, minWidth: 0 }}>
                <span style={{ display: "block", fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "16px", lineHeight: 1.3 }}>{s.title_de}</span>
                <span style={{ display: "block", fontFamily: "var(--font-serif)", fontStyle: "italic", fontSize: "13px", color: "var(--ink-soft)", marginTop: "2px" }}>{s.title_en}</span>
              </span>
              <span style={{ flexShrink: 0, fontFamily: "var(--font-mono)", fontSize: "10px", letterSpacing: "0.06em", color: read[s.id] ? "var(--good)" : "var(--ink-faint)", textAlign: "right" }}>
                {read[s.id] ? "✓" : (s.target_count || (s.glossary || []).length) + " w."}
              </span>
            </button>
          ))}
        </div>
      ))}
    </div>
  );
}

// ---------- ADD A WORD (commits straight to german_vocab.json on GitHub) ----------
// Uses the GitHub Contents API: read the file (+ its blob sha), insert the new
// entry, PUT it back. That PUT *is* a commit on GH_BRANCH, so GitHub Pages
// redeploys the JSON on its own. Needs a fine-grained personal access token
// with "Contents: Read and write" on this one repo, kept in localStorage like
// the Gemini key. The file is re-read on every add, so the commit always builds
// on the latest version (a concurrent edit makes the PUT fail rather than
// silently overwrite it).
const GH_OWNER = "Harsimar17";
const GH_REPO = "Deutsch-Vocab-Helper";
const GH_BRANCH = "main";
const GH_PATH = "german_vocab.json";
const GH_API = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}`;
const GH_TOKEN_KEY = "a2vocab.ghToken.v1";

// category → array name inside a level (nouns live under nouns.{der,die,das})
const CAT_TO_KEY = { adj: "adjectives", verb: "verbs", sep: "separable_verbs", func: "function_words", phrase: "phrases" };

function b64ToUtf8(b64) {
  const bin = atob(String(b64).replace(/\s/g, ""));
  return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
}
function utf8ToB64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(bin);
}

// Same field order the existing entries use, so the commit diff is just the new block.
function buildVocabEntry({ cat, de, en, example, prefix }) {
  if (NOUN_CATS.includes(cat)) {
    const word = de.replace(/^(der|die|das)\s+/i, "").trim();
    const e = { de: cat + " " + word, article: cat, word, en };
    if (example) e.example = example;
    return e;
  }
  const e = { de, en };
  if (prefix) e.prefix = prefix;
  if (example) e.example = example;
  return e;
}

function vocabList(json, lvl, cat) {
  const level = json.levels[lvl] || (json.levels[lvl] = {});
  if (NOUN_CATS.includes(cat)) {
    level.nouns = level.nouns || {};
    return level.nouns[cat] || (level.nouns[cat] = []);
  }
  const key = CAT_TO_KEY[cat];
  return level[key] || (level[key] = []);
}

async function ghFail(res) {
  let msg = "";
  try { msg = ((await res.json()).message) || ""; } catch (e) { /* non-JSON body */ }
  if (res.status === 401) return new Error("GitHub rejected the token (401) — check it in settings ▸");
  if (res.status === 403 || res.status === 404) {
    return new Error(`GitHub ${res.status}: token can't read/write ${GH_OWNER}/${GH_REPO} — it needs “Contents: Read and write”` + (msg ? ` (${msg})` : ""));
  }
  if (res.status === 409 || res.status === 422) return new Error("german_vocab.json changed on GitHub while saving — press add again");
  return new Error(`GitHub HTTP ${res.status}` + (msg ? `: ${msg}` : ""));
}

// Returns { url } of the new commit. Throws Error with a user-readable message.
async function commitVocabWord(token, lvl, cat, entry) {
  const headers = {
    Accept: "application/vnd.github+json",
    Authorization: "Bearer " + token,
    "X-GitHub-Api-Version": "2022-11-28",
  };
  const getRes = await fetch(GH_API + "?ref=" + encodeURIComponent(GH_BRANCH), { headers, cache: "no-store" });
  if (!getRes.ok) throw await ghFail(getRes);
  const file = await getRes.json();
  let text;
  if (file.content) {
    text = b64ToUtf8(file.content);
  } else {
    // Files over 1 MB come back without inline content — fetch the raw bytes
    // instead (the JSON response above still carries the sha the PUT needs).
    const rawRes = await fetch(GH_API + "?ref=" + encodeURIComponent(GH_BRANCH), {
      headers: Object.assign({}, headers, { Accept: "application/vnd.github.raw" }),
      cache: "no-store",
    });
    if (!rawRes.ok) throw await ghFail(rawRes);
    text = await rawRes.text();
  }

  const json = JSON.parse(text);
  const list = vocabList(json, lvl, cat);
  if (list.some((x) => normDe(x.de) === normDe(entry.de))) {
    throw new Error(`“${entry.de}” is already in ${lvl} on GitHub`);
  }
  list.push(entry);
  json.counts = json.counts || {};
  json.counts[lvl] = json.counts[lvl] || {};
  json.counts[lvl][cat] = (json.counts[lvl][cat] || 0) + 1;

  const label = (CATEGORY_META[cat] || {}).label || cat;
  const putRes = await fetch(GH_API, {
    method: "PUT",
    headers: Object.assign({ "Content-Type": "application/json" }, headers),
    body: JSON.stringify({
      message: `Add word: ${entry.de} (${lvl} ${label})`,
      content: utf8ToB64(JSON.stringify(json, null, 2) + "\n"),
      sha: file.sha,
      branch: GH_BRANCH,
    }),
  });
  if (!putRes.ok) throw await ghFail(putRes);
  const out = await putRes.json();
  return { url: out && out.commit && out.commit.html_url };
}

const fieldLabel = {
  display: "block", marginBottom: "6px", fontFamily: "var(--font-mono)", fontSize: "10px",
  letterSpacing: "0.12em", textTransform: "uppercase", color: "var(--ink-soft)",
};
const fieldInput = {
  width: "100%", boxSizing: "border-box", padding: "12px 14px", fontFamily: "var(--font-serif)", fontSize: "17px",
  border: "1px solid var(--line)", borderRadius: "10px", background: "var(--paper-raised)", color: "var(--ink)", outline: "none",
};

function AddWord({ allData, levels, ghToken, onToken, onAdded }) {
  const [lvl, setLvl] = useState(levels[0] || "A2");
  const [cat, setCat] = useState("der");
  const [de, setDe] = useState("");
  const [en, setEn] = useState("");
  const [example, setExample] = useState("");
  const [prefix, setPrefix] = useState("");
  const [state, setState] = useState({ status: "idle" });
  const saving = state.status === "saving";
  const isNoun = NOUN_CATS.includes(cat);

  // Not a <form>: LevelToggle / FilterBar render untyped buttons that would submit it.
  const submit = () => {
    if (saving) return;
    if (!ghToken) { setState({ status: "error", message: "Save your GitHub token below first — it's needed to commit." }); return; }
    const entry = buildVocabEntry({
      cat, de: de.trim(), en: en.trim(), example: example.trim(),
      prefix: cat === "sep" ? prefix.trim().toLowerCase() : "",
    });
    if (!entry.de || entry.de === cat + " " || !entry.en) {
      setState({ status: "error", message: "German and English are both required." });
      return;
    }
    if (allData.some((d) => d.lvl === lvl && d.cat === cat && normDe(d.de) === normDe(entry.de))) {
      setState({ status: "error", message: `“${entry.de}” is already in ${lvl}.` });
      return;
    }
    setState({ status: "saving" });
    commitVocabWord(ghToken, lvl, cat, entry)
      .then((r) => {
        onAdded({
          de: entry.de, en: entry.en, cat, lvl,
          example: entry.example || null, prefix: entry.prefix || null,
        });
        setDe(""); setEn(""); setExample(""); setPrefix("");
        setState({ status: "done", word: entry.de, lvl, url: r.url });
      })
      .catch((err) => setState({ status: "error", message: (err && err.message) || String(err) }));
  };

  return (
    <div
      onKeyDown={(e) => { if (e.key === "Enter" && e.target.tagName === "INPUT" && !e.nativeEvent.isComposing) submit(); }}
      style={{ ...srsCol, width: "min(440px, 92vw)", margin: "0 auto", gap: "16px", alignItems: "stretch" }}
    >
      <div style={{ textAlign: "center", fontFamily: "var(--font-mono)", fontSize: "10px", letterSpacing: "0.12em", textTransform: "uppercase", color: "var(--ink-faint)", lineHeight: 1.7 }}>
        adds the word to {GH_PATH} · one commit on {GH_BRANCH}
      </div>

      <LevelToggle levels={[lvl]} onToggle={setLvl} />
      <FilterBar active={[cat]} onToggle={setCat} />

      <label>
        <span style={fieldLabel}>{isNoun ? "German noun (article added for you)" : "German"}</span>
        <input value={de} onChange={(e) => setDe(e.target.value)} style={fieldInput} disabled={saving}
          placeholder={isNoun ? "Abfall" : cat === "sep" ? "vorbereiten" : cat === "phrase" ? "Ich bin der Meinung, dass ..." : ""}
          autoCapitalize="off" autoCorrect="off" spellCheck={false} />
      </label>
      <label>
        <span style={fieldLabel}>English</span>
        <input value={en} onChange={(e) => setEn(e.target.value)} style={fieldInput} disabled={saving}
          autoCapitalize="off" spellCheck={false} />
      </label>
      {cat === "sep" && (
        <label>
          <span style={fieldLabel}>Prefix (optional — guessed if blank)</span>
          <input value={prefix} onChange={(e) => setPrefix(e.target.value)} style={fieldInput} disabled={saving}
            placeholder="vor" autoCapitalize="off" autoCorrect="off" spellCheck={false} />
        </label>
      )}
      <label>
        <span style={fieldLabel}>Example sentence (optional{cat === "sep" || isNoun ? " — powers the fill-in quizzes" : ""})</span>
        <input value={example} onChange={(e) => setExample(e.target.value)} style={fieldInput} disabled={saving}
          placeholder={cat === "sep" ? "Ich bereite das Essen vor." : isNoun ? "Der Abfall kommt in den Müll." : ""} spellCheck={false} />
      </label>

      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "10px" }}>
        <button type="button" onClick={submit} disabled={saving} style={{ ...navBtnStyle, opacity: saving ? 0.6 : 1, cursor: saving ? "default" : "pointer" }}>
          {saving ? "committing …" : "add & commit ›"}
        </button>

        {!ghToken && (
          <GeminiKeyField
            value={ghToken}
            onChange={onToken}
            label="🔑 GitHub token (one-time)"
            placeholder="fine-grained token (github_pat_…)"
            help={`Needed once to commit to ${GH_PATH} in ${GH_OWNER}/${GH_REPO}. Create a fine-grained token at github.com/settings/personal-access-tokens limited to that repo with Contents: Read and write. Stored only in this browser.`}
          />
        )}
        {state.status === "error" && (
          <div style={{ fontFamily: "var(--font-mono)", fontSize: "11px", color: "var(--bad)", textAlign: "center", lineHeight: 1.5 }}>
            {state.message}
          </div>
        )}
        {state.status === "done" && (
          <div style={{ fontFamily: "var(--font-mono)", fontSize: "11px", color: "var(--good)", textAlign: "center", lineHeight: 1.6 }}>
            ✓ “{state.word}” committed to {GH_BRANCH}
            {state.url && <React.Fragment> · <a href={state.url} target="_blank" rel="noreferrer" style={{ color: "var(--good)" }}>view commit</a></React.Fragment>}
            <div style={{ color: "var(--ink-faint)" }}>
              live site picks it up after GitHub Pages redeploys (~1 min)
              {!levels.includes(state.lvl) ? ` · ${state.lvl} isn't selected in settings, so it won't show in Study yet` : ""}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- TAB BAR ----------
// Horizontally scrollable on narrow screens (iOS momentum scroll, snap points),
// and collapsible: the ‹ toggle retracts the whole strip to the left so only the
// current tab shows while you're focused on learning.
const TABS = [
  { id: "study", label: "Study" },
  { id: "write", label: "Write" },
  { id: "build", label: "Muster" },
  { id: "flash", label: "Cards" },
  { id: "quiz", label: "Quiz" },
  { id: "articles", label: "Articles" },
  { id: "sep", label: "Trennbare Verben" },
  { id: "cloze", label: "Fill-in" },
  { id: "mistakes", label: "Review" },
  { id: "add", label: "+ Add word" },
];

function TabBar({ mode, setMode, mistakeCount }) {
  const [open, setOpen] = useState(true);
  const stripRef = React.useRef(null);
  const active = TABS.find((t) => t.id === mode) || TABS[0];

  React.useEffect(() => {
    if (!open || !stripRef.current) return;
    const el = stripRef.current.querySelector('[data-on="1"]');
    if (el && el.scrollIntoView) el.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
  }, [mode, open]);

  const tabLabel = (t) => (t.id === "mistakes" && mistakeCount ? `${t.label} ${mistakeCount}` : t.label);
  const pill = (on, isMistakes) => ({
    flex: "0 0 auto",
    scrollSnapAlign: "center",
    whiteSpace: "nowrap",
    fontFamily: "var(--font-mono)",
    fontSize: "10px",
    fontWeight: 500,
    letterSpacing: "0.05em",
    textTransform: "uppercase",
    padding: "9px 15px",
    border: "none",
    borderRadius: "999px",
    background: on ? "var(--btn-grad)" : "transparent",
    color: on ? "#FCF8EE" : isMistakes && mistakeCount ? "var(--bad)" : "var(--ink-soft)",
    boxShadow: on ? "0 6px 16px -8px rgba(60,50,20,.55)" : "none",
    cursor: "pointer",
  });

  return (
    <div style={{ display: "flex", alignItems: "center", gap: "6px", width: "min(460px, 94vw)", alignSelf: "center" }}>
      <button
        onClick={() => setOpen((o) => !o)}
        aria-label={open ? "collapse tabs" : "expand tabs"}
        aria-expanded={open}
        style={{
          flexShrink: 0, width: "34px", height: "34px", borderRadius: "999px",
          fontFamily: "var(--font-mono)", fontSize: "13px", lineHeight: 1,
          border: "1px solid var(--line)", background: "var(--paper-raised)",
          color: "var(--ink-soft)", cursor: "pointer",
        }}
      >
        {open ? "‹" : "›"}
      </button>

      {!open && (
        <button onClick={() => setOpen(true)} style={{ ...pill(true, false), padding: "9px 18px" }}>
          {tabLabel(active)}
        </button>
      )}

      <div
        ref={stripRef}
        className="tabstrip"
        style={{
          display: "flex",
          gap: "3px",
          alignItems: "center",
          flex: 1,
          minWidth: 0,
          padding: open ? "3px" : "0",
          background: open ? "var(--tint)" : "transparent",
          border: `1px solid ${open ? "var(--line)" : "transparent"}`,
          borderRadius: "999px",
          overflowX: "auto",
          scrollSnapType: "x proximity",
          maxWidth: open ? "1200px" : "0px",
          opacity: open ? 1 : 0,
          pointerEvents: open ? "auto" : "none",
          transition: "max-width .34s cubic-bezier(.4,0,.2,1), opacity .18s ease, padding .2s ease",
        }}
      >
        {TABS.map((t) => {
          const on = mode === t.id;
          return (
            <button key={t.id} data-on={on ? "1" : "0"} onClick={() => setMode(t.id)} style={pill(on, t.id === "mistakes")}>
              {tabLabel(t)}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ---------- TOP BAR: Üben ⇄ Geschichten + light/dark ----------
function TopBar({ storyMode, onStoryMode, theme, onTheme }) {
  const seg = (on) => ({
    fontFamily: "var(--font-mono)", fontSize: "10px", fontWeight: 500, letterSpacing: "0.1em",
    textTransform: "uppercase", padding: "8px 16px", border: "none", borderRadius: "999px",
    background: on ? "var(--btn-grad)" : "transparent", color: on ? "#FCF8EE" : "var(--ink-soft)",
    boxShadow: on ? "0 6px 16px -8px rgba(0,0,0,.55)" : "none", cursor: "pointer", whiteSpace: "nowrap",
  });
  const dark = theme === "dark";
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "10px", position: "relative", minHeight: "40px" }}>
      <div role="group" aria-label="mode" style={{ display: "flex", gap: "3px", padding: "3px", background: "var(--tint)", border: "1px solid var(--line)", borderRadius: "999px" }}>
        <button onClick={() => onStoryMode(false)} aria-pressed={!storyMode} style={seg(!storyMode)}>✎ Üben</button>
        <button onClick={() => onStoryMode(true)} aria-pressed={storyMode} style={seg(storyMode)}>📖 Geschichten</button>
      </div>
      <button
        onClick={() => onTheme(dark ? "light" : "dark")}
        aria-label={dark ? "switch to light mode" : "switch to dark mode"}
        title={dark ? "Light mode" : "Dark mode"}
        style={{
          position: "absolute", right: 0, width: "36px", height: "36px", borderRadius: "999px",
          border: "1px solid var(--line)", background: "var(--paper-raised)", color: "var(--ink-soft)",
          fontSize: "15px", lineHeight: 1, cursor: "pointer", boxShadow: "var(--shadow-soft)",
        }}
      >
        {dark ? "☀" : "☾"}
      </button>
    </div>
  );
}

// A single fixed record shared by every browser/device — since this trainer
// is for one person only, there's no need for a separate identity per browser.
const PROGRESS_DOC_ID = "harsimar-progress";
function App() {
  const [mode, setMode] = useState("study");

  // Colour theme (light / dark), remembered per browser. The <head> script has
  // already put the initial value on <html data-theme> before first paint.
  const [theme, setTheme] = useState(() => document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light");
  applyCategoryPalette(theme);
  React.useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", theme === "dark" ? "#1b1915" : "#F6F1E5");
    try { localStorage.setItem("a2vocab.theme.v1", theme); } catch (e) { /* storage off */ }
  }, [theme]);

  // Story mode: a separate reading page — only the top bar and the stories.
  const [storyMode, setStoryMode] = useState(() => {
    try { return localStorage.getItem("a2vocab.storyMode.v1") === "1"; } catch (e) { return false; }
  });
  React.useEffect(() => {
    try { localStorage.setItem("a2vocab.storyMode.v1", storyMode ? "1" : "0"); } catch (e) { /* storage off */ }
  }, [storyMode]);
  const [activeCats, setActiveCats] = useState(CATS);
  const [levels, setLevels] = useState(["A2"]);
  const [direction, setDirection] = useState("de-en");
  const [noRepeat, setNoRepeat] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [ready, setReady] = useState(false);
  const [allTime, setAllTime] = useState({ right: 0, total: 0 });
  const [sessions, setSessions] = useState([]);

  // Words to re-test in the Review tab: { [cardId]: { wrong, right, ts } }.
  // Only removed by explicit user action — never on a timer or a streak.
  // Kept in localStorage — this trainer is single-user and the list is small.
  const [mistakes, setMistakes] = useState(() => {
    try {
      return JSON.parse(localStorage.getItem("a2vocab.mistakes.v1")) || {};
    } catch (e) {
      return {};
    }
  });
  React.useEffect(() => {
    try {
      localStorage.setItem("a2vocab.mistakes.v1", JSON.stringify(mistakes));
    } catch (e) {
      /* storage disabled / full — review list just won't persist */
    }
  }, [mistakes]);

  // Optional Google AI (Gemini) key for on-demand example sentences. Browser-only.
  const [geminiKey, setGeminiKey] = useState(() => {
    try {
      return localStorage.getItem("a2vocab.geminiKey.v1") || "";
    } catch (e) {
      return "";
    }
  });
  React.useEffect(() => {
    try {
      if (geminiKey) localStorage.setItem("a2vocab.geminiKey.v1", geminiKey);
      else localStorage.removeItem("a2vocab.geminiKey.v1");
    } catch (e) {
      /* storage disabled — key just won't persist between reloads */
    }
  }, [geminiKey]);

  // GitHub token for the "+ Add word" tab (commits to german_vocab.json). Browser-only.
  const [ghToken, setGhToken] = useState(() => {
    try {
      return localStorage.getItem(GH_TOKEN_KEY) || "";
    } catch (e) {
      return "";
    }
  });
  React.useEffect(() => {
    try {
      if (ghToken) localStorage.setItem(GH_TOKEN_KEY, ghToken);
      else localStorage.removeItem(GH_TOKEN_KEY);
    } catch (e) {
      /* storage disabled — token just won't persist between reloads */
    }
  }, [ghToken]);

  // Spaced-repetition schedule: { [stableKey]: { box, due, reps, lapses, last } }.
  // Drives the Study and Write tabs; every mode's result feeds it via bumpSrs.
  const [srs, setSrs] = useState(() => srsLoad("a2vocab.srs.v1", {}));
  React.useEffect(() => { srsSave("a2vocab.srs.v1", srs); }, [srs]);

  // Daily counters + streak shown in the header. Rolls over at local midnight.
  const [daily, setDaily] = useState(() =>
    srsLoad("a2vocab.daily.v1", { date: ymd(), reviewed: 0, introduced: 0, streak: 0, lastActive: "" })
  );
  React.useEffect(() => { srsSave("a2vocab.daily.v1", daily); }, [daily]);

  // Study/Write focus: "due" (scheduler), "all" (ignore schedule), "trouble".
  const [focus, setFocus] = useState("due");
  const readyRef = React.useRef(false);
  const srsRef = React.useRef(srs);
  React.useEffect(() => { readyRef.current = ready; }, [ready]);
  React.useEffect(() => { srsRef.current = srs; }, [srs]);

  // Vocabulary is fetched at startup from VOCAB_DATA_URL rather than bundled here.
  const [allData, setAllData] = useState(null); // null while loading
  const [stories, setStories] = useState(null);  // "stories" block of the same file, if present
  const [dataError, setDataError] = useState(null);
  const [loadAttempt, setLoadAttempt] = useState(0);

  const toggleCat = useCallback((c) => {
    setActiveCats((prev) => (prev.includes(c) ? prev.filter((x) => x !== c) : [...prev, c]));
  }, []);

  const toggleLevel = useCallback((lv) => {
    setLevels((prev) => {
      if (prev.includes(lv)) {
        // keep at least one level selected
        return prev.length === 1 ? prev : prev.filter((x) => x !== lv);
      }
      return LEVELS.filter((x) => x === lv || prev.includes(x));
    });
  }, []);

  React.useEffect(() => {
    let cancelled = false;
    setAllData(null);
    setDataError(null);
    const fetchJson = (url) =>
      fetch(url).then((res) => {
        if (!res.ok) throw new Error(`HTTP ${res.status} fetching vocab data`);
        return res.json();
      });
    fetchJson(VOCAB_DATA_URL)
      .catch(() => fetchJson(VOCAB_DATA_URL_FALLBACK))
      .then((json) => {
        if (cancelled) return;
        const items = buildDataFromJson(json);
        if (!items.length) throw new Error("Vocab data loaded but contained no entries");
        setAllData(items);
        setStories((json && json.stories) || null);
      })
      .catch((err) => {
        if (cancelled) return;
        console.error("Failed to load vocab data:", err);
        setDataError((err && err.message) || String(err));
      });
    return () => {
      cancelled = true;
    };
  }, [loadAttempt]);

  // A word just committed from the Add tab: make it usable right away instead of
  // waiting for GitHub Pages to redeploy the JSON. (After a reload the ids are
  // rebuilt from the file in level/category order.)
  const addWordLocally = useCallback((item) => {
    setAllData((prev) => {
      const id = (prev || []).reduce((m, d) => Math.max(m, d.id), -1) + 1;
      return (prev || []).concat(Object.assign({}, item, { id }));
    });
  }, []);

  const levelData = useMemo(() => (allData ? allData.filter((d) => levels.includes(d.lvl)) : []), [allData, levels]);
  const pool = useMemo(() => levelData.filter((d) => activeCats.includes(d.cat)), [levelData, activeCats]);
  const mistakeCount = Object.keys(mistakes).length;

  const idMap = useMemo(() => {
    const m = {};
    (allData || []).forEach((d) => { m[d.id] = d; });
    return m;
  }, [allData]);
  const dueCount = useMemo(
    () => pool.reduce((n, c) => { const s = srs[srsKey(c)]; return n + (s && (s.due || 0) <= Date.now() ? 1 : 0); }, 0),
    [pool, srs]
  );
  const newCount = useMemo(
    () => pool.reduce((n, c) => n + (srs[srsKey(c)] ? 0 : 1), 0),
    [pool, srs]
  );

  // Push one graded answer into the spaced-repetition schedule + today's counters.
  // grade is "again" | "good" | "easy". Called directly by Study/Write and,
  // via recordResult, by every other mode (correct → "good", wrong → "again").
  const persistSrs = useCallback((key, state) => {
    const fb = getFirebase();
    if (fb && readyRef.current) {
      fb.db.collection("scores").doc(PROGRESS_DOC_ID)
        .set({ srs: { [key]: state } }, { merge: true })
        .catch((err) => console.error("save srs failed:", err.code || err.message || err));
    }
  }, []);

  const bumpSrs = useCallback((card, grade) => {
    if (!card) return;
    const key = srsKey(card);
    const isNew = !srsRef.current[key];
    const state = srsAdvance(srsRef.current[key], grade);
    setSrs((prev) => Object.assign({}, prev, { [key]: state }));
    persistSrs(key, state);
    setDaily((d) => {
      const t = ymd();
      const nd = d.date === t ? Object.assign({}, d) : Object.assign({}, d, { date: t, reviewed: 0, introduced: 0 });
      if (nd.lastActive !== t) {
        nd.streak = nd.lastActive === ymdShift(t, -1) ? (nd.streak || 0) + 1 : 1;
        nd.lastActive = t;
      }
      nd.reviewed = (nd.reviewed || 0) + 1;
      if (isNew) nd.introduced = (nd.introduced || 0) + 1;
      const fb = getFirebase();
      if (fb && readyRef.current) {
        fb.db.collection("scores").doc(PROGRESS_DOC_ID).set({ daily: nd }, { merge: true }).catch(() => {});
      }
      return nd;
    });
  }, [persistSrs]);

  // Count one activity toward today's goal / streak without touching the SRS
  // schedule — used by the Satzbau tab, which practises word order, not words.
  const tickDaily = useCallback(() => {
    setDaily((d) => {
      const t = ymd();
      const nd = d.date === t ? Object.assign({}, d) : Object.assign({}, d, { date: t, reviewed: 0, introduced: 0 });
      if (nd.lastActive !== t) {
        nd.streak = nd.lastActive === ymdShift(t, -1) ? (nd.streak || 0) + 1 : 1;
        nd.lastActive = t;
      }
      nd.reviewed = (nd.reviewed || 0) + 1;
      const fb = getFirebase();
      if (fb && readyRef.current) {
        fb.db.collection("scores").doc(PROGRESS_DOC_ID).set({ daily: nd }, { merge: true }).catch(() => {});
      }
      return nd;
    });
  }, []);

  // Every mode feeds the review list through here. A miss adds the word (or bumps
  // its miss count); a hit only records that it went right. Nothing is ever
  // removed automatically — the learner decides when a word comes off the list
  // (per word in the Review tab, or "clear whole list"). It also feeds the
  // spaced-repetition schedule so words come back on their own timetable.
  const recordResult = useCallback((cardId, correct) => {
    const card = idMap[cardId];
    if (card) bumpSrs(card, correct ? "good" : "again");
    setMistakes((prev) => {
      const cur = prev[cardId];
      if (correct) {
        if (!cur) return prev; // not on the list — a hit alone never adds it
        return { ...prev, [cardId]: { ...cur, right: (cur.right || 0) + 1 } };
      }
      return {
        ...prev,
        [cardId]: {
          wrong: ((cur && cur.wrong) || 0) + 1,
          right: (cur && cur.right) || 0,
          ts: Date.now(),
        },
      };
    });
  }, [idMap, bumpSrs]);

  const removeMistake = useCallback((cardId) => {
    setMistakes((prev) => {
      if (!prev[cardId]) return prev;
      const next = { ...prev };
      delete next[cardId];
      return next;
    });
  }, []);

  const clearAllMistakes = useCallback(() => setMistakes({}), []);

  const loadSessions = useCallback(() => {
    const fb = getFirebase();
    if (!fb) return;
    fb.db
      .collection("scores").doc(PROGRESS_DOC_ID).collection("sessions")
      .orderBy("timestamp", "desc")
      .limit(15)
      .get()
      .then((qs) => {
        setSessions(qs.docs.map((d) => ({ id: d.id, ...d.data() })));
      })
      .catch((err) => console.error("loadSessions failed:", err.code || err.message || err));
  }, []);

  // Sign in anonymously (required by the security rules) then load the one shared record
  React.useEffect(() => {
    const fb = getFirebase();
    if (!fb) return; // Firebase SDK not loaded — app still works, just no persistence
    const unsub = fb.auth.onAuthStateChanged((user) => {
      if (user) {
        setReady(true);
        fb.db.collection("scores").doc(PROGRESS_DOC_ID).get().then((snap) => {
          if (snap.exists) {
            const d = snap.data();
            setAllTime({ right: d.right || 0, total: d.total || 0 });
            if (d.srs) {
              setSrs((local) => {
                const merged = srsMerge(local, d.srs);
                srsSave("a2vocab.srs.v1", merged);
                fb.db.collection("scores").doc(PROGRESS_DOC_ID).set({ srs: merged }, { merge: true }).catch(() => {});
                return merged;
              });
            }
            if (d.daily && d.daily.date) {
              setDaily((local) => {
                const remote = d.daily;
                const pick = (remote.lastActive || "") > (local.lastActive || "") ? remote
                  : (remote.lastActive || "") < (local.lastActive || "") ? local
                  : ((remote.reviewed || 0) >= (local.reviewed || 0) ? remote : local);
                srsSave("a2vocab.daily.v1", pick);
                return pick;
              });
            }
          }
        }).catch((err) => console.error("load progress failed:", err.code || err.message || err));
        loadSessions();
      }
    });
    fb.auth.signInAnonymously().catch(() => {});
    return () => unsub && unsub();
  }, [loadSessions]);

  const handleAnswer = useCallback((correct) => {
    setAllTime((prev) => {
      const next = { right: prev.right + (correct ? 1 : 0), total: prev.total + 1 };
      const fb = getFirebase();
      if (fb && ready) {
        fb.db.collection("scores").doc(PROGRESS_DOC_ID).set(
          {
            right: window.firebase.firestore.FieldValue.increment(correct ? 1 : 0),
            total: window.firebase.firestore.FieldValue.increment(1),
          },
          { merge: true }
        ).catch((err) => console.error("save allTime failed:", err.code || err.message || err));
      }
      return next;
    });
  }, [ready]);

  const handleSaveSession = useCallback((score) => {
    const fb = getFirebase();
    if (!fb || !ready) return;
    const record = { right: score.right, total: score.total, cats: activeCats, timestamp: Date.now() };
    fb.db
      .collection("scores").doc(PROGRESS_DOC_ID).collection("sessions")
      .add(record)
      .then(() => loadSessions())
      .catch((err) => console.error("save session failed:", err.code || err.message || err));
  }, [ready, activeCats, loadSessions]);

  const handleClearHistory = useCallback(() => {
    const fb = getFirebase();
    if (!fb || !ready) return;
    const sessionsRef = fb.db.collection("scores").doc(PROGRESS_DOC_ID).collection("sessions");
    sessionsRef
      .get()
      .then((qs) => {
        const batch = fb.db.batch();
        qs.docs.forEach((d) => batch.delete(d.ref));
        return batch.commit();
      })
      .then(() => setSessions([]))
      .catch((err) => console.error("clear history failed:", err.code || err.message || err));
  }, [ready]);

  const shellStyle = {
    minHeight: "100%",
    padding: "36px 20px 48px",
    fontFamily: "var(--font-serif)",
    display: "flex",
    alignItems: "center",
    justifyContent: "center",
  };

  if (dataError) {
    return (
      <div style={shellStyle}>
        <div style={{ maxWidth: "420px", textAlign: "center", display: "flex", flexDirection: "column", gap: "16px" }}>
          <div style={{ fontSize: "22px", color: "var(--ink)" }}>Couldn't load the vocabulary</div>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", color: "var(--bad)" }}>{dataError}</div>
          <div style={{ fontSize: "13px", color: "var(--ink-muted)" }}>
            Checked <code>{VOCAB_DATA_URL}</code>
          </div>
          <button onClick={() => setLoadAttempt((n) => n + 1)} style={navBtnStyle}>⟲ retry</button>
        </div>
      </div>
    );
  }

  if (!allData) {
    return (
      <div style={shellStyle}>
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "13px", letterSpacing: "0.1em", color: "var(--ink-muted)" }}>
          loading vocabulary …
        </div>
      </div>
    );
  }

  const topBar = (
    <TopBar storyMode={storyMode} onStoryMode={setStoryMode} theme={theme} onTheme={setTheme} />
  );

  if (storyMode) {
    return (
      <div style={{ minHeight: "100%", padding: "20px 20px 56px", fontFamily: "var(--font-serif)" }}>
        <div style={{ maxWidth: "620px", margin: "0 auto", display: "flex", flexDirection: "column", gap: "22px" }}>
          {topBar}
          <div style={{ animation: "cardIn .35s ease both" }}>
            <StoriesTab stories={stories} allData={allData} />
          </div>
        </div>
      </div>
    );
  }

  return (
    <div
      style={{
        minHeight: "100%",
        padding: "20px 20px 56px",
        fontFamily: "var(--font-serif)",
      }}
    >
      <div style={{ maxWidth: "560px", margin: "0 auto", display: "flex", flexDirection: "column", gap: "18px" }}>
        {topBar}
        <div style={{ textAlign: "center" }}>
          <div
            style={{
              display: "inline-block",
              fontFamily: "var(--font-mono)",
              fontSize: "9px",
              letterSpacing: "0.16em",
              textTransform: "uppercase",
              color: "var(--ink-faint)",
              border: "1px solid var(--line)",
              borderRadius: "999px",
              padding: "3px 11px",
              marginBottom: "14px",
            }}
          >
            ⇣ data fetched from JSON file
          </div>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: "10px", fontWeight: 500, letterSpacing: "0.28em", color: "var(--accent)", marginBottom: "8px" }}>
            {levels.length === 1
              ? `${levels[0]} · ${LEVEL_META[levels[0]]}`
              : LEVELS.filter((lv) => levels.includes(lv)).join("  +  ")}
          </div>
           <div style={{ fontSize: "13px", fontStyle: "italic", color: "var(--ink-soft)", marginTop: "8px" }}>
            {levelData.length} cards — nouns, verbs, separable verbs, adjectives, connectors &amp; phrases
          </div>
          <div style={{ width: "48px", height: "2px", background: "var(--accent)", opacity: 0.5, borderRadius: "2px", margin: "18px auto 0" }} />
        </div>

        <div style={{ textAlign: "center" }}>
          <button
            onClick={() => setSettingsOpen((o) => !o)}
            style={{
              fontFamily: "var(--font-mono)",
              fontSize: "10px",
              letterSpacing: "0.1em",
              textTransform: "uppercase",
              color: "var(--ink-soft)",
              background: settingsOpen ? "var(--tint)" : "transparent",
              border: "1px solid var(--line)",
              borderRadius: "999px",
              padding: "8px 16px",
              cursor: "pointer",
              maxWidth: "100%",
            }}
          >
            {settingsOpen ? "▾" : "▸"} {LEVELS.filter((lv) => levels.includes(lv)).join("+")} · {activeCats.length === CATS.length ? "all categories" : `${activeCats.length}/${CATS.length} categories`} · {direction === "de-en" ? "DE→EN" : "EN→DE"}
            {noRepeat ? " · no repeats" : ""}
            {focus !== "due" ? " · focus: " + focus : ""}
            {geminiKey ? " · ✨ AI" : ""}
          </button>
        </div>

        {settingsOpen && (
          <div style={{ display: "flex", flexDirection: "column", gap: "14px" }}>
            <LevelToggle levels={levels} onToggle={toggleLevel} />
            <FilterBar active={activeCats} onToggle={toggleCat} />
            <div style={{ display: "flex", justifyContent: "center", gap: "10px", flexWrap: "wrap" }}>
              <DirectionToggle direction={direction} onChange={setDirection} />
              <NoRepeatToggle noRepeat={noRepeat} onChange={setNoRepeat} />
            </div>
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "6px" }}>
              <div style={{ fontFamily: "var(--font-mono)", fontSize: "10px", letterSpacing: "0.12em", textTransform: "uppercase", color: "var(--ink-soft)" }}>
                Study / Write focus
              </div>
              <div style={{ display: "flex", gap: "6px", flexWrap: "wrap", justifyContent: "center" }}>
                {[["due", "due today"], ["all", "everything"], ["trouble", "trouble words"]].map(([f, lbl]) => (
                  <button
                    key={f}
                    onClick={() => setFocus(f)}
                    style={{
                      fontFamily: "var(--font-mono)", fontSize: "10px", fontWeight: 500,
                      letterSpacing: "0.08em", textTransform: "uppercase", padding: "7px 13px",
                      borderRadius: "999px",
                      border: "1px solid " + (focus === f ? "var(--accent)" : "var(--ink-faint)"),
                      background: focus === f ? "var(--accent)" : "transparent",
                      color: focus === f ? "#FCF8EE" : "var(--ink-soft)", cursor: "pointer",
                    }}
                  >
                    {lbl}
                  </button>
                ))}
              </div>
            </div>
            <GeminiKeyField value={geminiKey} onChange={setGeminiKey} />
            <GeminiKeyField
              value={ghToken}
              onChange={setGhToken}
              label="🔑 GitHub token"
              placeholder="fine-grained token (github_pat_…)"
              help={`Kept only in this browser (localStorage). Used by “+ Add word” to commit to ${GH_PATH} in ${GH_OWNER}/${GH_REPO}. Create a fine-grained token at github.com/settings/personal-access-tokens limited to that one repo, with Contents: Read and write — nothing else.`}
            />
          </div>
        )}

        <StreakHeader
          daily={daily}
          focus={focus}
          dueCount={mode === "study" || mode === "write" ? dueCount : null}
          newCount={newCount}
        />

        <TabBar mode={mode} setMode={setMode} mistakeCount={mistakeCount} />

        <div style={{ marginTop: "6px", animation: "cardIn .35s ease both" }} key={mode}>
          {mode === "study" && <StudyMode pool={pool} srs={srs} daily={daily} focus={focus} direction={direction} onGrade={bumpSrs} geminiKey={geminiKey} />}
          {mode === "write" && <WriteMode pool={pool} srs={srs} daily={daily} focus={focus} onGrade={bumpSrs} geminiKey={geminiKey} />}
          {mode === "build" && <PatternStudy onSeen={tickDaily} />}
          {mode === "flash" && <Flashcards pool={pool} allData={allData} direction={direction} noRepeat={noRepeat} onResult={recordResult} geminiKey={geminiKey} />}
          {mode === "quiz" && <Quiz pool={pool} allTime={allTime} onAnswer={handleAnswer} onResult={recordResult} sessions={sessions} onSaveSession={handleSaveSession} onClearHistory={handleClearHistory} direction={direction} noRepeat={noRepeat} geminiKey={geminiKey} />}
          {mode === "articles" && <ArticleQuiz pool={pool} noRepeat={noRepeat} onResult={recordResult} geminiKey={geminiKey} />}
          {mode === "sep" && <SeparableVerbs pool={pool} onResult={recordResult} geminiKey={geminiKey} />}
          {mode === "cloze" && <ClozeQuiz pool={pool} noRepeat={noRepeat} onResult={recordResult} geminiKey={geminiKey} />}
          {mode === "add" && <AddWord allData={allData} levels={levels} ghToken={ghToken} onToken={setGhToken} onAdded={addWordLocally} />}
          {mode === "mistakes" && <MistakesReview mistakes={mistakes} allData={allData} direction={direction} onResult={recordResult} onRemove={removeMistake} onClearAll={clearAllMistakes} geminiKey={geminiKey} />}
        </div>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
