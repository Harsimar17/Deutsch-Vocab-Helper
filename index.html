  );
}

function StudyMode({ pool, srs, daily, focus, direction, onGrade, geminiKey }) {
  const [queue, setQueue] = useState([]);
  const [i, setI] = useState(0);
  const [graded, setGraded] = useState(0);
  const [sentenceBreak, setSentenceBreak] = useState(null);
  const [round, setRound] = useState(0);
  const seq = React.useRef(0);

  React.useEffect(() => {
    const q = srsQueue(pool, srs, daily, focus).map((c) => Object.assign({}, c, { _qid: ++seq.current }));
    setQueue(q);
    setI(0);
    setGraded(0);
    setSentenceBreak(null);
    // srs/daily read once per round on purpose so the queue doesn't reshuffle mid-session
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [pool.length, focus, round, direction]);

  if (pool.length === 0) {
    return <p style={srsNote}>No categories selected — turn some on in settings ▸.</p>;
  }
  if (queue.length === 0) {
    if (focus === "trouble") {
      return <p style={srsNote}>No trouble words yet — nothing missed {SRS_TROUBLE_LAPSES}+ times. Keep going in <strong>Study</strong> or <strong>Write</strong>. 🎉</p>;
    }
    return (
      <div style={{ ...srsCol, padding: "36px 0" }}>
        <div style={{ fontFamily: "var(--font-serif)", fontSize: "22px", textAlign: "center" }}>You're caught up for today 🎉</div>
        <p style={srsNote}>Every word that's due has been reviewed, and today's {SRS_NEW_PER_DAY} new words are done. Come back tomorrow — or set <strong>focus → everything</strong> in settings ▸ to keep drilling now.</p>
      </div>
    );
  }

  if (i >= queue.length) {
    return (
      <div style={{ ...srsCol, padding: "36px 0" }}>
        <div style={{ fontFamily: "var(--font-serif)", fontSize: "22px", textAlign: "center" }}>{graded} reviewed this round 🎉</div>
        <button onClick={() => setRound((r) => r + 1)} style={navBtnStyle}>⟲ keep going</button>
      </div>
    );
  }

  const card = queue[i];
  const isNew = !srs[srsKey(card)];

  if (sentenceBreak) {
    return (
      <div style={{ ...srsCol, padding: "10px 0" }}>
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "10px", letterSpacing: "0.18em", color: "var(--ink-faint)" }}>SAY IT OUT LOUD</div>
        <div style={{ fontFamily: "var(--font-serif)", fontSize: "20px", textAlign: "center", maxWidth: "min(440px, 92vw)", lineHeight: 1.5 }}>
          Build your own sentence with <strong>{sentenceBreak.de}</strong> — “{sentenceBreak.en}”. Say it aloud, then check yourself against one below.
        </div>
        <AiSentence card={sentenceBreak} apiKey={geminiKey} />
        <button onClick={() => { setSentenceBreak(null); setI((x) => x + 1); }} style={navBtnStyle}>continue ›</button>
      </div>
    );
  }

  const grade = (g) => {
    onGrade(card, g);
    const n = graded + 1;
    setGraded(n);
    if (g === "again") {
      setQueue((qq) => qq.concat([Object.assign({}, card, { _qid: ++seq.current })]));
      setI((x) => x + 1);
    } else if (n % 5 === 0) {
      setSentenceBreak(card);
    } else {
      setI((x) => x + 1);
    }
  };

  return (
    <div style={srsCol}>
      <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", letterSpacing: "0.1em", color: "var(--ink-muted)" }}>
        {i + 1} / {queue.length}{focus === "all" ? " · all" : focus === "trouble" ? " · trouble" : ""}
      </div>
      <StudyCard card={card} direction={direction} onGrade={grade} isNew={isNew} geminiKey={geminiKey} />
    </div>
  );
}

function WriteMode({ pool, srs, daily, focus, onGrade, geminiKey }) {
  const [queue, setQueue] = useState([]);
  const [i, setI] = useState(0);
  const [val, setVal] = useState("");
  const [res, setRes] = useState(null);
  const [typed, setTyped] = useState(0);
  const [round, setRound] = useState(0);
  const ref = React.useRef(null);
  const seq = React.useRef(0);

  React.useEffect(() => {
    const q = srsQueue(pool, srs, daily, focus).map((c) => Object.assign({}, c, { _qid: ++seq.current }));
    setQueue(q); setI(0); setVal(""); setRes(null); setTyped(0);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [pool.length, focus, round]);

  React.useEffect(() => {
    if (ref.current && !res) ref.current.focus();
  }, [i, res, queue.length]);

  // Enter always works, even after focus has left the text box: first press
  // checks the answer, the next press moves to the following word.
  const check = () => {
    const c = queue[i];
    if (!c || res) return;
    const r = checkDe(c, val);
    if (r.verdict === "empty") return;
    setRes(r);
    onGrade(c, r.verdict === "correct" ? "good" : "again");
    setTyped((d) => d + 1);
  };
  const advance = () => { setRes(null); setVal(""); setI((x) => x + 1); };
  React.useEffect(() => {
    const onKey = (e) => {
      if (e.key !== "Enter" || e.isComposing) return;
      // Ignore Enter aimed at some other control (a button, the settings key field);
      // only our answer box, or nothing focused, drives the shortcut.
      const el = e.target;
      if (el && el !== ref.current && /^(BUTTON|INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
      if (i >= queue.length) return;
      e.preventDefault();
      if (res) advance(); else check();
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [queue, i, val, res]);

  if (pool.length === 0) {
    return <p style={srsNote}>No categories selected — turn some on in settings ▸.</p>;
  }
  if (queue.length === 0) {
    return <p style={srsNote}>Nothing due to type right now. Set <strong>focus → everything</strong> in settings ▸ to practise producing any word.</p>;
  }
  if (i >= queue.length) {
    return (
      <div style={{ ...srsCol, padding: "36px 0" }}>
        <div style={{ fontFamily: "var(--font-serif)", fontSize: "22px", textAlign: "center" }}>{typed} typed this round 🎉</div>
        <button onClick={() => setRound((r) => r + 1)} style={navBtnStyle}>⟲ keep going</button>
      </div>
    );
  }

  const card = queue[i];
  const isNoun = card.cat === "der" || card.cat === "die" || card.cat === "das";
  const forms = acceptedDe(card);
  const ok = res && res.verdict === "correct";
  const close = res && res.verdict === "close";
  const tone = ok ? "var(--good)" : close ? "#8A6A2B" : "var(--bad)";

  return (
    <div style={srsCol}>
      <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", letterSpacing: "0.1em", color: "var(--ink-muted)" }}>
        {i + 1} / {queue.length} · TYPE IT IN GERMAN
      </div>

      <div style={{ textAlign: "center" }}>
        <div style={{ marginBottom: "10px" }}><CatChip cat={card.cat} /></div>
        <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: (card.en || "").length > 26 ? "20px" : "28px", color: "var(--ink)" }}>{card.en}</div>
        {isNoun && !res && (
          <div style={{ fontFamily: "var(--font-mono)", fontSize: "9px", letterSpacing: "0.14em", textTransform: "uppercase", color: "var(--ink-faint)", marginTop: "6px" }}>
            include the article
          </div>
        )}
      </div>

      <input
        ref={ref}
        value={val}
        onChange={(e) => setVal(e.target.value)}
        readOnly={!!res}
        placeholder="dein Deutsch…"
        autoCapitalize="off"
        autoCorrect="off"
        spellCheck={false}
        style={{
          width: "min(440px, 92vw)", padding: "14px 16px", textAlign: "center",
          fontFamily: "var(--font-serif)", fontSize: "20px",
          border: "1px solid " + (res ? tone : "var(--line)"), borderRadius: "12px",
          background: "var(--paper-raised)", color: "var(--ink)", outline: "none",
        }}
      />

      {!res && (
        <React.Fragment>
          <div style={{ display: "flex", gap: "6px" }}>
            {["ä", "ö", "ü", "ß"].map((ch) => (
              <button
                key={ch}
                type="button"
                onMouseDown={(e) => { e.preventDefault(); setVal((v) => v + ch); if (ref.current) ref.current.focus(); }}
                style={{
                  fontFamily: "var(--font-serif)", fontSize: "17px", fontWeight: 600,
                  width: "40px", height: "40px", borderRadius: "9px",
                  border: "1px solid var(--line)", background: "var(--paper-raised)",
                  color: "var(--ink)", cursor: "pointer",
                }}
              >
                {ch}
              </button>
            ))}
          </div>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: "9px", letterSpacing: "0.1em", textTransform: "uppercase", color: "var(--ink-faint)", marginTop: "-6px" }}>
            no umlaut key? tap above — or just type ae / oe / ue / ss
          </div>
          <button onClick={check} style={navBtnStyle}>check › <span style={{ opacity: 0.6 }}>⏎</span></button>
        </React.Fragment>
      )}

      {res && (
        <div style={{ ...srsCol, gap: "10px" }}>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", letterSpacing: "0.08em", color: tone }}>
            {ok ? "✓ RICHTIG" : close ? "≈ FAST" : "✗ NOCH NICHT"}
          </div>
          {!ok && (
            <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "22px", color: "var(--ink)", textAlign: "center" }}>
              {forms.join("  /  ")}
            </div>
          )}
          {ok && res.spelled && (
            <div style={{ fontFamily: "var(--font-serif)", fontSize: "15px", color: "var(--ink-soft)", textAlign: "center" }}>
              accepted — the umlaut spelling is <strong style={{ color: "var(--ink)" }}>{res.spelled}</strong>
            </div>
          )}
          {res.hint && (
            <div style={{ fontFamily: "var(--font-serif)", fontStyle: "italic", fontSize: "14px", color: "var(--ink-soft)", textAlign: "center" }}>{res.hint}</div>
          )}
          <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
            <SpeakButton text={card.de} />
            <button onClick={advance} style={navBtnStyle}>next › <span style={{ opacity: 0.6 }}>⏎</span></button>
          </div>
          <AiSentence card={card} apiKey={geminiKey} />
        </div>
      )}
    </div>
  );
}

function makeQuestion(pool, correctPool) {
  const source = correctPool && correctPool.length > 0 ? correctPool : pool;
  const correct = source[Math.floor(Math.random() * source.length)];
  const sameCat = pool.filter((d) => d.cat === correct.cat && d.id !== correct.id);
  const distractPool = (sameCat.length >= 3 ? sameCat : pool.filter((d) => d.id !== correct.id));
  const distractors = shuffle(distractPool).slice(0, 3);
  const options = shuffle([correct, ...distractors]);
  return { correct, options };
}

function Quiz({ pool, allTime, onAnswer, onResult, sessions, onSaveSession, onClearHistory, direction, noRepeat, geminiKey }) {
  const [askedIds, setAskedIds] = useState(() => new Set());
  const [q, setQ] = useState(() => makeQuestion(pool));
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState({ right: 0, total: 0 });
  const [saved, setSaved] = useState(false);
  const [done, setDone] = useState(false);
  const [historyOpen, setHistoryOpen] = useState(false);

  const resetRound = React.useCallback(() => {
    const fresh = new Set();
    const nq = makeQuestion(pool);
    if (noRepeat) fresh.add(nq.correct.id);
    setAskedIds(fresh);
    setQ(nq);
    setPicked(null);
    setDone(false);
  }, [pool, noRepeat]);

  React.useEffect(() => {
    resetRound();
    setScore({ right: 0, total: 0 });
    setSaved(false);
  }, [pool.length, noRepeat, direction]);

  if (pool.length < 4) {
    return <p style={{ textAlign: "center", color: "var(--ink-muted)" }}>Pick at least a couple categories above — need a few options to quiz from.</p>;
  }

  const choose = (opt) => {
    if (picked) return;
    setPicked(opt);
    const correct = opt.id === q.correct.id;
    setScore((s) => ({ right: s.right + (correct ? 1 : 0), total: s.total + 1 }));
    setSaved(false);
    onAnswer && onAnswer(correct);
    onResult && onResult(q.correct.id, correct);
  };

  const nextQ = () => {
    if (noRepeat) {
      const remaining = pool.filter((d) => !askedIds.has(d.id));
      if (remaining.length === 0) {
        setDone(true);
        setPicked(null);
        return;
      }
      const nq = makeQuestion(pool, remaining);
      setAskedIds((prev) => new Set(prev).add(nq.correct.id));
      setQ(nq);
      setPicked(null);
    } else {
      setQ(makeQuestion(pool));
      setPicked(null);
    }
  };

  const finishSession = () => {
    if (score.total === 0) return;
    onSaveSession && onSaveSession(score);
    setSaved(true);
    setScore({ right: 0, total: 0 });
  };

  if (done) {
    return (
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "16px", padding: "40px 0" }}>
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", letterSpacing: "0.1em", color: "var(--ink-muted)" }}>
          SCORE {score.right} / {score.total}
        </div>
        <div style={{ fontFamily: "var(--font-serif)", fontSize: "22px", color: "var(--ink)", textAlign: "center" }}>
          All {pool.length} / {pool.length} words done 🎉
        </div>
        <div style={{ display: "flex", gap: "10px" }}>
          {score.total > 0 && (
            <button
              onClick={finishSession}
              style={{
                ...navBtnStyle,
                background: saved ? "var(--good)" : "transparent",
                border: `1px solid ${saved ? "var(--good)" : "var(--ink-muted)"}`,
                color: saved ? "#F6F1E5" : "var(--ink-muted)",
              }}
            >
              {saved ? "✓ saved" : "finish & save this round"}
            </button>
          )}
          <button onClick={resetRound} style={navBtnStyle}>⟲ start over</button>
        </div>
      </div>
    );
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "18px" }}>
      <div
        style={{
          fontFamily: "var(--font-mono)",
          fontSize: "12px",
          letterSpacing: "0.1em",
          color: "var(--ink-muted)",
        }}
      >
        SCORE {score.right} / {score.total}
        {allTime && allTime.total > 0 && (
          <span style={{ marginLeft: "14px", color: "var(--ink-faint)" }}>
            · ALL-TIME {allTime.right} / {allTime.total}
          </span>
        )}
      </div>

      {noRepeat && (
        <div
          style={{
            fontFamily: "var(--font-mono)",
            fontSize: "11px",
            letterSpacing: "0.08em",
            color: "var(--ink-muted)",
            marginTop: "-10px",
          }}
        >
          {askedIds.size} / {pool.length} attempted
        </div>
      )}

      <div style={{ textAlign: "center" }}>
        <div style={{ marginBottom: "10px" }}><CatChip cat={q.correct.cat} /></div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "14px", flexWrap: "wrap" }}>
          {direction === "de-en" && <SpeakButton text={q.correct.de} />}
          <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "30px", letterSpacing: "-0.01em", color: "var(--ink)" }}>{promptText(q.correct, direction)}</div>
          {direction === "en-de" && picked && <SpeakButton text={q.correct.de} />}
          {picked && (
            <button onClick={nextQ} style={navBtnStyle}>next ›</button>
          )}
        </div>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: "10px", width: "min(420px, 90vw)" }}>
        {q.options.map((opt) => {
          let bg = "var(--paper-raised)";
          let border = "var(--line-card)";
          let color = "var(--ink)";
          let shadow = "var(--shadow-soft)";
          if (picked) {
            if (opt.id === q.correct.id) {
              bg = "linear-gradient(180deg,var(--good-hi),var(--good))"; border = "var(--good)"; color = "#F6F1E5";
              shadow = "0 10px 22px -10px rgba(63,122,85,.7)";
            } else if (opt.id === picked.id) {
              bg = "linear-gradient(180deg,var(--bad-hi),var(--bad))"; border = "var(--bad)"; color = "#F6F1E5";
              shadow = "0 10px 22px -10px rgba(165,53,74,.7)";
            } else {
              bg = "transparent"; border = "var(--line-card)"; color = "var(--ink-faint)"; shadow = "none";
            }
          }
          const optText = answerText(opt, direction);
          return (
            <button
              key={opt.id}
              onClick={() => choose(opt)}
              style={{
                textAlign: "left",
                fontFamily: "var(--font-serif)",
                fontWeight: 500,
                fontSize: optText.length > 28 ? "14px" : "17px",
                padding: "14px 18px",
                borderRadius: "12px",
                border: `1px solid ${border}`,
                background: bg,
                color,
                boxShadow: shadow,
                cursor: picked ? "default" : "pointer",
              }}
            >
              {optText}
            </button>
          );
        })}
      </div>

      {picked && <AiSentence card={q.correct} apiKey={geminiKey} />}

      {score.total > 0 && (
        <button
          onClick={finishSession}
          style={{
            ...navBtnStyle,
            background: saved ? "var(--good)" : "transparent",
            border: `1px solid ${saved ? "var(--good)" : "var(--ink-muted)"}`,
            color: saved ? "#F6F1E5" : "var(--ink-muted)",
          }}
        >
          {saved ? "✓ saved" : "finish & save this round"}
        </button>
      )}

      {sessions && sessions.length > 0 && (
        <div style={{ width: "min(420px, 90vw)", marginTop: "10px" }}>
          <div
            style={{
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              gap: "12px",
            }}
          >
            <button
              onClick={() => setHistoryOpen((o) => !o)}
              style={{
                fontFamily: "var(--font-mono)",
                fontSize: "11px",
                letterSpacing: "0.1em",
                color: "var(--ink-muted)",
                background: "transparent",
                border: "none",
                padding: 0,
                cursor: "pointer",
              }}
            >
              {historyOpen ? "▾" : "▸"} PAST ROUNDS ({sessions.length})
            </button>
            {historyOpen && onClearHistory && (
              <button
                onClick={() => {
                  if (window.confirm("Clear all saved rounds? This can't be undone.")) onClearHistory();
                }}
                style={{
                  fontFamily: "var(--font-mono)",
                  fontSize: "10px",
                  letterSpacing: "0.08em",
                  textTransform: "uppercase",
                  color: "var(--bad)",
                  background: "transparent",
                  border: "1px solid var(--bad)",
                  borderRadius: "10px",
                  padding: "2px 8px",
                  cursor: "pointer",
                }}
              >
                clear history
              </button>
            )}
          </div>
          {historyOpen && (
            <div style={{ display: "flex", flexDirection: "column", gap: "6px", marginTop: "10px" }}>
              {sessions.map((s) => {
                const pct = s.total ? Math.round((s.right / s.total) * 100) : 0;
                const d = s.timestamp ? new Date(s.timestamp) : null;
                const dateStr = d
                  ? d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) +
                    " " +
                    d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" })
                  : "";
                return (
                  <div
                    key={s.id}
                    style={{
                      display: "flex",
                      justifyContent: "space-between",
                      fontFamily: "var(--font-mono)",
                      fontSize: "12px",
                      color: "var(--ink-soft)",
                      background: "var(--paper-raised)",
                      border: "1px solid var(--line-card)",
                      borderRadius: "3px",
                      padding: "7px 12px",
                    }}
                  >
                    <span>{dateStr}</span>
                    <span>{s.right}/{s.total} ({pct}%)</span>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

const ARTICLE_OPTIONS = ["der", "die", "das"];
function stripArticle(deText) {
  return deText.replace(/^(der|die|das)\s+/, "");
}
function makeArticleQuestion(nounPool, correctPool) {
  const source = correctPool && correctPool.length > 0 ? correctPool : nounPool;
  const word = source[Math.floor(Math.random() * source.length)];
  return word;
}

function ArticleQuiz({ pool, noRepeat, onResult, geminiKey }) {
  const nounPool = useMemo(() => pool.filter((d) => d.cat === "der" || d.cat === "die" || d.cat === "das"), [pool]);

  const [askedIds, setAskedIds] = useState(() => new Set());
  const [word, setWord] = useState(() => (nounPool.length > 0 ? makeArticleQuestion(nounPool) : null));
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState({ right: 0, total: 0 });
  const [saved, setSaved] = useState(false);
  const [done, setDone] = useState(false);

  const resetRound = React.useCallback(() => {
    if (nounPool.length === 0) return;
    const w = makeArticleQuestion(nounPool);
    const fresh = new Set();
    if (noRepeat) fresh.add(w.id);
    setAskedIds(fresh);
    setWord(w);
    setPicked(null);
    setDone(false);
  }, [nounPool, noRepeat]);

  React.useEffect(() => {
    resetRound();
    setScore({ right: 0, total: 0 });
    setSaved(false);
  }, [nounPool.length, noRepeat]);

  if (nounPool.length === 0) {
    return <p style={{ textAlign: "center", color: "var(--ink-muted)" }}>Select at least one of der / die / das above to practice articles.</p>;
  }
  if (!word) return null;

  const choose = (article) => {
    if (picked) return;
    setPicked(article);
    const correct = article === word.cat;
    setScore((s) => ({ right: s.right + (correct ? 1 : 0), total: s.total + 1 }));
    setSaved(false);
    onResult && onResult(word.id, correct);
  };

  const nextQ = () => {
    if (noRepeat) {
      const remaining = nounPool.filter((d) => !askedIds.has(d.id));
      if (remaining.length === 0) {
        setDone(true);
        setPicked(null);
        return;
      }
      const w = makeArticleQuestion(nounPool, remaining);
      setAskedIds((prev) => new Set(prev).add(w.id));
      setWord(w);
      setPicked(null);
    } else {
      setWord(makeArticleQuestion(nounPool));
      setPicked(null);
    }
  };

  if (done) {
    return (
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "16px", padding: "40px 0" }}>
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", letterSpacing: "0.1em", color: "var(--ink-muted)" }}>
          SCORE {score.right} / {score.total}
        </div>
        <div style={{ fontFamily: "var(--font-serif)", fontSize: "22px", color: "var(--ink)", textAlign: "center" }}>
          All {nounPool.length} / {nounPool.length} nouns done 🎉
        </div>
        <button onClick={resetRound} style={navBtnStyle}>⟲ start over</button>
      </div>
    );
  }

  const bare = stripArticle(word.de);

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "18px" }}>
      <div
        style={{
          fontFamily: "var(--font-mono)",
          fontSize: "12px",
          letterSpacing: "0.1em",
          color: "var(--ink-muted)",
        }}
      >
        SCORE {score.right} / {score.total}
      </div>

      {noRepeat && (
        <div
          style={{
            fontFamily: "var(--font-mono)",
            fontSize: "11px",
            letterSpacing: "0.08em",
            color: "var(--ink-muted)",
            marginTop: "-10px",
          }}
        >
          {askedIds.size} / {nounPool.length} attempted
        </div>
      )}

      <div style={{ textAlign: "center" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "14px", flexWrap: "wrap" }}>
          <SpeakButton text={picked ? word.de : bare} />
          <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "34px", letterSpacing: "-0.01em", color: "var(--ink)" }}>{bare}</div>
          {picked && (
            <button onClick={nextQ} style={navBtnStyle}>next ›</button>
          )}
        </div>
        <div style={{ fontFamily: "var(--font-serif)", fontStyle: "italic", fontSize: "15px", color: "var(--ink-soft)", marginTop: "8px" }}>{word.en}</div>
      </div>

      <div style={{ display: "flex", gap: "12px" }}>
        {ARTICLE_OPTIONS.map((art) => {
          const meta = CATEGORY_META[art];
          let bg = meta.color + "0d";
          let color = meta.color;
          let shadow = "none";
          if (picked) {
            if (art === word.cat) { bg = meta.color; color = "#FCF8EE"; shadow = `0 10px 24px -10px ${meta.color}`; }
            else if (art === picked && picked !== word.cat) { bg = "var(--bad)"; color = "#FCF8EE"; shadow = "0 10px 24px -10px var(--bad)"; }
            else { bg = "transparent"; color = "var(--ink-faint)"; }
          }
          return (
            <button
              key={art}
              onClick={() => choose(art)}
              style={{
                fontFamily: "var(--font-serif)",
                fontWeight: 600,
                fontSize: "21px",
                padding: "14px 30px",
                borderRadius: "12px",
                border: `1.5px solid ${picked && art === word.cat ? meta.color : picked && art === picked ? "var(--bad)" : meta.color + "66"}`,
                background: bg,
                color,
                boxShadow: shadow,
                cursor: picked ? "default" : "pointer",
              }}
            >
              {art}
            </button>
          );
        })}
      </div>

      {picked && <AiSentence card={word} apiKey={geminiKey} />}
    </div>
  );
}

// ---------- FILL-IN-THE-BLANK (cloze) ----------
// Uses the hand-written example sentence on each noun card, blanks out the noun,
// and offers 4 same-gender nouns to choose from. Only nouns carry example
// sentences in the data, so this mode works off der / die / das.
const NOUN_CATS = ["der", "die", "das"];
function nounForms(card) {
  let de = String(card.de || "").replace(/\s*\((?:Pl\.|WG)\)/g, "").trim();
  return de
    .split(" / ")
    .map((s) => s.replace(/^(der|die|das)\s+/i, "").trim())
    .filter(Boolean);
}
function clozeMatch(card) {
  const sentence = String(card.example || "");
  if (!sentence) return null;
  for (const f of nounForms(card)) {
    const esc = f.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const m = sentence.match(new RegExp(esc, "i"));
    if (m) {
      return {
        answer: m[0],
        before: sentence.slice(0, m.index),
        after: sentence.slice(m.index + m[0].length),
      };
    }
  }
  return null;
}
function makeClozeQuestion(pool, correctPool) {
  const source = correctPool && correctPool.length > 0 ? correctPool : pool;
  const correct = source[Math.floor(Math.random() * source.length)];
  const hit = clozeMatch(correct);
  const sameCat = pool.filter((d) => d.cat === correct.cat && d.id !== correct.id);
  const distractPool = sameCat.length >= 3 ? sameCat : pool.filter((d) => d.id !== correct.id);
  const distractors = shuffle(distractPool).slice(0, 3);
  const options = shuffle([correct, ...distractors]).map((d) => ({ id: d.id, label: nounForms(d)[0] }));
  return { correct, hit, options };
}

function ClozeQuiz({ pool, noRepeat, onResult, geminiKey }) {
  const clozePool = useMemo(
    () => pool.filter((d) => NOUN_CATS.includes(d.cat) && d.example && clozeMatch(d)),
    [pool]
  );

  const [askedIds, setAskedIds] = useState(() => new Set());
  const [q, setQ] = useState(() => (clozePool.length > 0 ? makeClozeQuestion(clozePool) : null));
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState({ right: 0, total: 0 });
  const [done, setDone] = useState(false);

  const resetRound = React.useCallback(() => {
    if (clozePool.length === 0) return;
    const nq = makeClozeQuestion(clozePool);
    const fresh = new Set();
    if (noRepeat) fresh.add(nq.correct.id);
    setAskedIds(fresh);
    setQ(nq);
    setPicked(null);
    setDone(false);
  }, [clozePool, noRepeat]);

  React.useEffect(() => {
    resetRound();
    setScore({ right: 0, total: 0 });
  }, [clozePool.length, noRepeat]);

  if (clozePool.length < 4) {
    return (
      <p style={{ textAlign: "center", color: "var(--ink-soft)", maxWidth: "min(440px, 92vw)", margin: "0 auto", lineHeight: 1.6 }}>
        Fill-in-the-blank runs on example sentences — select <strong>der / die / das</strong> above (and enough nouns) to play.
      </p>
    );
  }
  if (!q) return null;

  const choose = (optId) => {
    if (picked) return;
    setPicked(optId);
    const correct = optId === q.correct.id;
    setScore((s) => ({ right: s.right + (correct ? 1 : 0), total: s.total + 1 }));
    onResult && onResult(q.correct.id, correct);
  };

  const nextQ = () => {
    if (noRepeat) {
      const remaining = clozePool.filter((d) => !askedIds.has(d.id));
      if (remaining.length === 0) {
        setDone(true);
        setPicked(null);
        return;
      }
      const nq = makeClozeQuestion(clozePool, remaining);
      setAskedIds((prev) => new Set(prev).add(nq.correct.id));
      setQ(nq);
      setPicked(null);
    } else {
      setQ(makeClozeQuestion(clozePool));
      setPicked(null);
    }
  };

  if (done) {
    return (
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "16px", padding: "40px 0" }}>
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", letterSpacing: "0.1em", color: "var(--ink-faint)" }}>
          SCORE {score.right} / {score.total}
        </div>
        <div style={{ fontFamily: "var(--font-serif)", fontSize: "22px", color: "var(--ink)", textAlign: "center" }}>
          All {clozePool.length} / {clozePool.length} sentences done 🎉
        </div>
        <button onClick={resetRound} style={navBtnStyle}>⟲ start over</button>
      </div>
    );
  }

  const accent = CATEGORY_META[q.correct.cat].color;

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "18px" }}>
      <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", letterSpacing: "0.1em", color: "var(--ink-faint)" }}>
        SCORE {score.right} / {score.total}
      </div>

      {noRepeat && (
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "11px", letterSpacing: "0.08em", color: "var(--ink-faint)", marginTop: "-10px" }}>
          {askedIds.size} / {clozePool.length} attempted
        </div>
      )}

      <div
        style={{
          position: "relative",
          width: "min(440px, 92vw)",
          background: "var(--card-grad)",
          border: "1px solid var(--line-card)",
          borderRadius: "16px",
          boxShadow: "var(--shadow-card)",
          padding: "26px 22px",
          textAlign: "center",
        }}
      >
        {picked && (
          <button
            onClick={nextQ}
            aria-label="next question"
            style={{
              ...navBtnStyle,
              position: "absolute",
              right: "14px",
              top: "18px",
              zIndex: 5,
              padding: "8px 14px",
              fontSize: "11px",
              borderRadius: "999px",
              boxShadow: "0 8px 20px -6px rgba(60,50,20,.7)",
            }}
          >
            next ›
          </button>
        )}
        <div style={{ marginBottom: "16px" }}><CatChip cat={q.correct.cat} /></div>
        <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "21px", lineHeight: 1.7, color: "var(--ink)" }}>
          {q.hit.before}
          <span
            style={{
              display: "inline-block",
              minWidth: "84px",
              margin: "0 4px",
              padding: "0 8px 2px",
              borderBottom: `2px solid ${picked ? accent : "var(--ink-faint)"}`,
              color: picked ? accent : "transparent",
              fontWeight: 700,
            }}
          >
            {picked ? q.hit.answer : " "}
          </span>
          {q.hit.after}
        </div>
        {picked && (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "12px", marginTop: "14px" }}>
            <SpeakButton text={(q.hit.before + q.hit.answer + q.hit.after).trim() || q.correct.de} size={30} />
            <div style={{ fontFamily: "var(--font-serif)", fontStyle: "italic", fontSize: "14px", color: "var(--ink-soft)" }}>
              {q.correct.de} · {q.correct.en}
            </div>
          </div>
        )}
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: "10px", width: "min(440px, 92vw)" }}>
        {q.options.map((opt) => {
          let bg = "var(--paper-raised)";
          let border = "var(--line-card)";
          let color = "var(--ink)";
          let shadow = "var(--shadow-soft)";
          if (picked) {
            if (opt.id === q.correct.id) {
              bg = "linear-gradient(180deg,var(--good-hi),var(--good))"; border = "var(--good)"; color = "#FCF8EE";
              shadow = "0 10px 22px -10px rgba(63,122,85,.7)";
            } else if (opt.id === picked) {
              bg = "linear-gradient(180deg,var(--bad-hi),var(--bad))"; border = "var(--bad)"; color = "#FCF8EE";
              shadow = "0 10px 22px -10px rgba(165,53,74,.7)";
            } else {
              bg = "transparent"; border = "var(--line-card)"; color = "var(--ink-faint)"; shadow = "none";
            }
          }
          return (
            <button
              key={opt.id}
              onClick={() => choose(opt.id)}
              style={{
                fontFamily: "var(--font-serif)",
                fontWeight: 600,
                fontSize: opt.label.length > 22 ? "15px" : "18px",
                textAlign: "center",
                padding: "14px 16px",
                borderRadius: "12px",
                border: `1px solid ${border}`,
                background: bg,
                color,
                boxShadow: shadow,
                cursor: picked ? "default" : "pointer",
              }}
            >
              {opt.label}
            </button>
          );
        })}
      </div>

      {picked && <AiSentence card={q.correct} apiKey={geminiKey} />}
    </div>
  );
}

// ---------- REVIEW (re-test past mistakes) ----------
// Drills the words in `mistakes` — anything missed in Quiz / Articles / Fill-in,
// or flagged with "✗ review this" on a flashcard. Same 4-option meaning test as
// Quiz. Nothing ever leaves the list on its own: a word stays until you remove
// it yourself (per word, or "clear whole list"), so you can revise as long as
// you like. The list ignores the level / category filters so mistakes never
// silently disappear from view.
function MistakesReview({ mistakes, allData, direction, onResult, onRemove, onClearAll, geminiKey }) {
  const byId = useMemo(() => Object.fromEntries(allData.map((d) => [d.id, d])), [allData]);

  // Snapshot the list at mount (the tab remounts on every switch via key={mode}),
  // so clearing a word mid-round doesn't reshuffle the remaining questions.
  const [queue, setQueue] = useState(() =>
    shuffle(Object.keys(mistakes).map(Number).filter((id) => byId[id]))
  );
  const [pos, setPos] = useState(0);
  const [picked, setPicked] = useState(null);
  const [results, setResults] = useState({});
  const [roundKey, setRoundKey] = useState(0);

  const startRound = React.useCallback(
    (ids) => {
      const base = (ids && ids.length ? ids : Object.keys(mistakes).map(Number)).filter((id) => byId[id]);
      setQueue(shuffle(base));
      setPos(0);
      setPicked(null);
      setResults({});
      setRoundKey((k) => k + 1);
    },
    [mistakes, byId]
  );

  const card = byId[queue[pos]];
  const options = useMemo(() => {
    if (!card) return [];
    const sameCat = allData.filter((d) => d.cat === card.cat && d.id !== card.id);
    const distractPool = sameCat.length >= 3 ? sameCat : allData.filter((d) => d.id !== card.id);
    return shuffle([card, ...shuffle(distractPool).slice(0, 3)]);
  }, [card, allData, pos, roundKey]);

  const total = Object.keys(mistakes).length;

  if (total === 0) {
    return (
      <p style={{ textAlign: "center", color: "var(--ink-soft)", maxWidth: "min(440px, 92vw)", margin: "0 auto", lineHeight: 1.7 }}>
        Nothing to review yet. Words you miss in <strong>Quiz</strong>, <strong>Articles</strong>, <strong>Fill-in</strong> or <strong>Trennbare Verben</strong> — or flag with <strong>✗&nbsp;review&nbsp;this</strong> on a card — collect here and stay until <em>you</em> take them off. Revise them as often as you like.
      </p>
    );
  }

  const done = pos >= queue.length;
  if (done) {
    const answered = Object.keys(results).length;
    const gotRight = Object.values(results).filter(Boolean).length;
    const missedThisRound = queue.filter((id) => results[id] === false && mistakes[id]);
    return (
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "16px", padding: "32px 0" }}>
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", letterSpacing: "0.1em", color: "var(--ink-faint)" }}>
          THIS ROUND {gotRight} / {answered} right
        </div>
        <div style={{ fontFamily: "var(--font-serif)", fontSize: "22px", color: "var(--ink)", textAlign: "center" }}>
          {`${total} word${total === 1 ? "" : "s"} on the list`}
        </div>
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "10px", letterSpacing: "0.08em", color: "var(--ink-faint)", textAlign: "center", maxWidth: "min(420px, 90vw)", lineHeight: 1.6 }}>
          words stay here until you take them off — revise as long as you like
        </div>
        <div style={{ display: "flex", gap: "10px", flexWrap: "wrap", justifyContent: "center" }}>
          {missedThisRound.length > 0 && (
            <button onClick={() => startRound(missedThisRound)} style={navBtnStyle}>↻ redo the {missedThisRound.length} I missed</button>
          )}
          <button onClick={() => startRound()} style={navBtnStyle}>⟲ review all {total}</button>
        </div>
      </div>
    );
  }

  if (!card) {
    return (
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "16px", padding: "32px 0" }}>
        <button onClick={() => startRound()} style={navBtnStyle}>⟲ restart review</button>
      </div>
    );
  }

  const choose = (opt) => {
    if (picked) return;
    setPicked(opt);
    const correct = opt.id === card.id;
    setResults((r) => ({ ...r, [card.id]: correct }));
    onResult && onResult(card.id, correct);
  };
  const next = () => {
    setPicked(null);
    setPos((p) => p + 1);
  };

  const info = mistakes[card.id] || {};

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "18px" }}>
      <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", letterSpacing: "0.1em", color: "var(--ink-faint)" }}>
        REVIEW {pos + 1} / {queue.length}
        <span style={{ marginLeft: "14px", color: "var(--ink-faint)" }}>· {total} on list</span>
      </div>

      <div style={{ textAlign: "center" }}>
        <div style={{ marginBottom: "10px" }}><CatChip cat={card.cat} /></div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "14px", flexWrap: "wrap" }}>
          {direction === "de-en" && <SpeakButton text={card.de} />}
          <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "30px", letterSpacing: "-0.01em", color: "var(--ink)" }}>
            {promptText(card, direction)}
          </div>
          {direction === "en-de" && picked && <SpeakButton text={card.de} />}
          {picked && <button onClick={next} style={navBtnStyle}>next ›</button>}
        </div>
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "10px", letterSpacing: "0.12em", textTransform: "uppercase", color: "var(--ink-faint)", marginTop: "10px" }}>
          {info.wrong ? `missed ${info.wrong}×` : "flagged"}{info.right ? `  ·  got it ${info.right}×` : ""}
        </div>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: "10px", width: "min(420px, 90vw)" }}>
        {options.map((opt) => {
          let bg = "var(--paper-raised)";
          let border = "var(--line-card)";
          let color = "var(--ink)";
          let shadow = "var(--shadow-soft)";
          if (picked) {
            if (opt.id === card.id) {
              bg = "linear-gradient(180deg,var(--good-hi),var(--good))"; border = "var(--good)"; color = "#F6F1E5";
              shadow = "0 10px 22px -10px rgba(63,122,85,.7)";
            } else if (opt.id === picked.id) {
              bg = "linear-gradient(180deg,var(--bad-hi),var(--bad))"; border = "var(--bad)"; color = "#F6F1E5";
              shadow = "0 10px 22px -10px rgba(165,53,74,.7)";
            } else {
              bg = "transparent"; border = "var(--line-card)"; color = "var(--ink-faint)"; shadow = "none";
            }
          }
          const optText = answerText(opt, direction);
          return (
            <button
              key={opt.id}
              onClick={() => choose(opt)}
              style={{
                textAlign: "left",
                fontFamily: "var(--font-serif)",
                fontWeight: 500,
                fontSize: optText.length > 28 ? "14px" : "17px",
                padding: "14px 18px",
                borderRadius: "12px",
                border: `1px solid ${border}`,
                background: bg,
                color,
                boxShadow: shadow,
                cursor: picked ? "default" : "pointer",
              }}
            >
              {optText}
            </button>
          );
        })}
      </div>

      {picked && <AiSentence card={card} apiKey={geminiKey} />}

      {picked && (
        <button
          onClick={() => { onRemove && onRemove(card.id); next(); }}
          style={{
            ...navBtnStyle,
            background: "transparent", color: "var(--good)", border: "1px solid var(--good)", boxShadow: "none",
          }}
        >
          ✓ I know this — take it off the list
        </button>
      )}

      <div style={{ display: "flex", gap: "10px", flexWrap: "wrap", justifyContent: "center", marginTop: "6px" }}>
        <button
          onClick={() => startRound()}
          style={{
            fontFamily: "var(--font-mono)", fontSize: "10px", letterSpacing: "0.08em", textTransform: "uppercase",
            color: "var(--ink-soft)", background: "transparent", border: "1px solid var(--line)", borderRadius: "10px",
            padding: "4px 10px", cursor: "pointer",
          }}
        >
          ⟲ reshuffle round
        </button>
        <button
          onClick={() => {
            if (window.confirm(`Clear all ${total} words from the review list? This can't be undone.`)) onClearAll();
          }}
          style={{
            fontFamily: "var(--font-mono)", fontSize: "10px", letterSpacing: "0.08em", textTransform: "uppercase",
            color: "var(--bad)", background: "transparent", border: "1px solid var(--bad)", borderRadius: "10px",
            padding: "4px 10px", cursor: "pointer",
          }}
        >
          clear whole list
        </button>
      </div>
    </div>
  );
}

// ---------- TRENNBARE VERBEN (separable verbs) ----------
// Drills the mechanic that trips learners up: the separable prefix jumps to the
// end of the clause. We show the sentence with the prefix blanked out and ask
// which prefix belongs there.
const SEP_PREFIXES = [
  "auf", "an", "aus", "ein", "mit", "nach", "vor", "zu", "ab", "um",
  "zurück", "weg", "hin", "her", "fest", "los", "teil", "statt", "durch",
  "heraus", "zusammen", "vorbei", "fern", "bei", "mit",
];
const SEP_COMMON = ["auf", "an", "aus", "ein", "mit", "nach", "vor", "zu", "ab", "um"];

function sepParts(card) {
  let de = String(card.de || "").trim();
  de = de.replace(/^sich\s+/i, "").replace(/\s+(mit|auf|an|über|für|zu|nach|von|in|bei|um)$/i, "").trim();
  const inf = de.split(" ")[0] || de;
  const prefix = String(
    card.prefix || SEP_PREFIXES.find((p) => inf.toLowerCase().startsWith(p)) || ""
  ).toLowerCase();
  return { inf, prefix };
}

function sepCloze(card, prefix) {
  const ex = String(card.example || "").trim();
  if (!ex || !prefix) return null;
  const esc = prefix.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const re = new RegExp("(^|[\\s(])(" + esc + ")(?=[\\s.,!?;:)]|$)", "gi");
  let m, last = null;
  while ((m = re.exec(ex))) last = m;
  if (!last) return null;
  const at = last.index + last[1].length;
  return { before: ex.slice(0, at), after: ex.slice(at + prefix.length), answer: ex.substr(at, prefix.length) };
}

function makeSepQuestion(playable, avoidId) {
  if (!playable || playable.length === 0) return null;
  const src = playable.length > 1 && avoidId != null ? playable.filter((d) => d.id !== avoidId) : playable;
  const card = src[Math.floor(Math.random() * src.length)];
  const { prefix } = sepParts(card);
  const cloze = sepCloze(card, prefix);
  const distractors = shuffle(SEP_COMMON.filter((p) => p !== prefix)).slice(0, 3);
  const options = shuffle([prefix, ...distractors]);
  return { card, answer: prefix, cloze, options };
}

function SeparableVerbs({ pool, onResult, geminiKey }) {
  const playable = useMemo(() => {
    return pool.filter((d) => {
      if (d.cat !== "sep") return false;
      const { prefix } = sepParts(d);
      return prefix && sepCloze(d, prefix);
    });
  }, [pool]);

  const [q, setQ] = useState(() => makeSepQuestion(playable));
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState({ right: 0, total: 0 });

  React.useEffect(() => {
    setQ(makeSepQuestion(playable));
    setPicked(null);
    setScore({ right: 0, total: 0 });
  }, [playable.length]);

  if (playable.length < 4) {
    return (
      <p style={{ textAlign: "center", color: "var(--ink-soft)", maxWidth: "min(440px, 92vw)", margin: "0 auto", lineHeight: 1.7 }}>
        Not enough separable verbs in the current selection — turn on the <strong>trenn.</strong> category (and a level or two) in settings ▸.
      </p>
    );
  }
  if (!q || !q.cloze) return null;

  const { inf } = sepParts(q.card);

  const choose = (opt) => {
    if (picked) return;
    setPicked(opt);
    const correct = opt === q.answer;
    setScore((s) => ({ right: s.right + (correct ? 1 : 0), total: s.total + 1 }));
    onResult && onResult(q.card.id, correct);
  };
  const nextQ = () => {
    setQ(makeSepQuestion(playable, q.card.id));
    setPicked(null);
  };

  const accent = CATEGORY_META.sep.color;

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "18px" }}>
      <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", letterSpacing: "0.1em", color: "var(--ink-faint)" }}>
        SCORE {score.right} / {score.total}
        <span style={{ marginLeft: "12px", color: "var(--ink-faint)" }}>· {playable.length} verbs</span>
      </div>

      <div
        style={{
          position: "relative",
          width: "min(440px, 92vw)",
          background: "var(--card-grad)",
          border: "1px solid var(--line-card)",
          borderRadius: "16px",
          boxShadow: "var(--shadow-card)",
          padding: "26px 22px",
          textAlign: "center",
        }}
      >
        {picked && (
          <button
            onClick={nextQ}
            aria-label="next question"
            style={{
              ...navBtnStyle,
              position: "absolute", right: "14px", top: "18px", zIndex: 5,
              padding: "8px 14px", fontSize: "11px", borderRadius: "999px",
              boxShadow: "0 8px 20px -6px rgba(60,50,20,.7)",
            }}
          >
            next ›
          </button>
        )}
        <div style={{ marginBottom: "14px" }}><CatChip cat="sep" /></div>
        <div style={{ fontFamily: "var(--font-serif)", fontStyle: "italic", fontSize: "15px", color: "var(--ink-soft)", marginBottom: "12px" }}>
          {picked ? `${inf} — ${q.card.en}` : q.card.en}
        </div>
        <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "21px", lineHeight: 1.7, color: "var(--ink)" }}>
          {q.cloze.before}
          <span
            style={{
              display: "inline-block", minWidth: "68px", margin: "0 4px", padding: "0 8px 2px",
              borderBottom: `2px solid ${picked ? accent : "var(--ink-faint)"}`,
              color: picked ? accent : "transparent", fontWeight: 700,
            }}
          >
            {picked ? q.cloze.answer : " "}
          </span>
          {q.cloze.after}
        </div>
        {picked && (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "12px", marginTop: "14px" }}>
            <SpeakButton text={(q.cloze.before + q.cloze.answer + q.cloze.after).trim() || q.card.example} size={30} />
            <div style={{ fontFamily: "var(--font-mono)", fontSize: "10px", letterSpacing: "0.12em", textTransform: "uppercase", color: picked === q.answer ? "var(--good)" : "var(--bad)" }}>
              {picked === q.answer ? "richtig" : `→ ${q.answer}`}
            </div>
          </div>
        )}
      </div>

      <div style={{ fontFamily: "var(--font-mono)", fontSize: "10px", letterSpacing: "0.12em", textTransform: "uppercase", color: "var(--ink-faint)" }}>
        which prefix goes in the gap?
      </div>

      <div style={{ display: "flex", gap: "10px", flexWrap: "wrap", justifyContent: "center", width: "min(440px, 92vw)" }}>
        {q.options.map((opt) => {
          const meta = CATEGORY_META.sep;
          let bg = meta.color + "0d";
          let color = meta.color;
          let border = meta.color + "66";
          let shadow = "none";
          if (picked) {
            if (opt === q.answer) { bg = meta.color; color = "#FCF8EE"; border = meta.color; shadow = `0 10px 24px -10px ${meta.color}`; }
            else if (opt === picked) { bg = "var(--bad)"; color = "#FCF8EE"; border = "var(--bad)"; shadow = "0 10px 24px -10px var(--bad)"; }
            else { bg = "transparent"; color = "var(--ink-faint)"; border = "var(--line-card)"; }
          }
          return (
            <button
              key={opt}
              onClick={() => choose(opt)}
              style={{
                fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "19px",
                padding: "12px 24px", borderRadius: "12px",
                border: `1.5px solid ${border}`, background: bg, color, boxShadow: shadow,
                cursor: picked ? "default" : "pointer",
              }}
            >
              {opt}
            </button>
          );
        })}
      </div>

      {picked && <AiSentence card={q.card} apiKey={geminiKey} />}
    </div>
  );
}

// ---------- MUSTER (sentence-pattern viewer) ----------
// Not an exercise — a viewer. Each German sentence pattern is shown as a row of
// colour-coded slots (Position ①, Verb ②, Satzende, Konjunktion, …). You pick a
// pattern and scroll through several real A2 sentences that ALL take the same
// shape, so the word-order rule becomes something you recognise rather than
// something you compute. Nothing to type, nothing scored. 🔊 reads each aloud.
const CHUNK_ROLE = {
  front:  { bd: "#3A5A8C", fg: "var(--ink)", bg: "#3A5A8C14", cap: "Position ①" },
  v2:     { bd: "#8A6A2B", fg: "#FCF8EE", bg: "#8A6A2B",   cap: "Verb ②" },
  end:    { bd: "var(--good)", fg: "#FCF8EE", bg: "var(--good)",   cap: "Satzende" },
  konj:   { bd: "#6B4A8A", fg: "#6B4A8A", bg: "#6B4A8A12", cap: "Konjunktion" },
  subj:   { bd: "var(--line)", fg: "var(--ink)", bg: "var(--paper-raised)", cap: "Subjekt" },
  time:   { bd: "var(--line)", fg: "var(--ink)", bg: "var(--paper-raised)", cap: "Zeit" },
  place:  { bd: "var(--line)", fg: "var(--ink)", bg: "var(--paper-raised)", cap: "Ort" },
  obj:    { bd: "var(--line)", fg: "var(--ink)", bg: "var(--paper-raised)", cap: "Objekt" },
  manner: { bd: "var(--line)", fg: "var(--ink)", bg: "var(--paper-raised)", cap: "Art & Weise" },
  mid:    { bd: "var(--line)", fg: "var(--ink-soft)", bg: "transparent", cap: "" },
};

function ChunkRow({ chunks, big }) {
  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: "6px", justifyContent: "center", alignItems: "flex-end" }}>
      {chunks.map((ch, i) => {
        const m = CHUNK_ROLE[ch[1]] || CHUNK_ROLE.mid;
        const cap = ch[2] != null ? ch[2] : m.cap;
        const strong = ch[1] === "v2" || ch[1] === "end";
        return (
          <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "3px" }}>
            <div style={{
              fontFamily: "var(--font-serif)", fontSize: big ? "16px" : "14px",
              fontWeight: strong ? 700 : 500, padding: "6px 10px", borderRadius: "8px", lineHeight: 1.15,
              border: "1px solid " + m.bd, background: m.bg, color: m.fg,
            }}>
              {ch[0]}
            </div>
            <div style={{ fontFamily: "var(--font-mono)", fontSize: "7.5px", letterSpacing: "0.05em", textTransform: "uppercase", color: "var(--ink-faint)", minHeight: "9px", textAlign: "center" }}>
              {cap}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function PatternStudy({ onSeen }) {
  const [pi, setPi] = useState(0);
  const pat = SENTENCE_PATTERNS[pi];
  const seenRef = React.useRef({});
  React.useEffect(() => {
    if (!seenRef.current[pat.key]) { seenRef.current[pat.key] = true; onSeen && onSeen(); }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [pi]);
  const say = (chunks) => speakGerman(chunks.map((c) => c[0]).join(" ").replace(/\s+([,.!?])/g, "$1"));

  return (
    <div style={{ ...srsCol, width: "min(620px, 95vw)", margin: "0 auto", gap: "18px" }}>
      <div className="tabstrip" style={{ display: "flex", gap: "6px", overflowX: "auto", maxWidth: "100%", padding: "2px", scrollSnapType: "x proximity" }}>

              flexShrink: 0, width: 28, height: 28, display: "inline-flex", alignItems: "center", justifyContent: "center",
              borderRadius: "999px", border: "1px solid var(--line)", background: "var(--paper-raised)", color: "var(--accent)",
              fontSize: "13px", cursor: "pointer", boxShadow: "var(--shadow-soft)",
            }}>🔊</button>
            <span style={{ fontFamily: "var(--font-serif)", fontStyle: "italic", fontSize: "13px", color: "var(--ink-soft)", textAlign: "center" }}>{ex.en}</span>
          </div>
        </div>
      ))}
    </div>
  );
}

// ---------- GESCHICHTEN (B1 reading) ----------
// Short B1 stories from the "stories" block of german_vocab.json. **word** in the
// text marks a B1 target word. Tap (or hover, with a mouse) any word the app
// knows — a story target, or any A1/A2/B1 card — to see its English meaning.
// A switch shows the English translation under each German paragraph.
const STORY_PREFS_KEY = "a2vocab.storyPrefs.v1";
const STORY_READ_KEY = "a2vocab.storiesRead.v1";
const GLOSS_TYPE_CAT = { verbs: "verb", adjectives: "adj", separable_verbs: "sep", function_words: "func", phrases: "phrase" };

// Common irregular forms → infinitive, so "ist" / "hatte" / "ging" still resolve.
const IRREGULAR_DE = {
  bin: "sein", bist: "sein", ist: "sein", sind: "sein", seid: "sein", war: "sein", warst: "sein", waren: "sein", gewesen: "sein", wäre: "sein", wären: "sein",
  hat: "haben", hast: "haben", habe: "haben", hatte: "haben", hatten: "haben", gehabt: "haben", hätte: "haben", hätten: "haben",

  muss: "müssen", musst: "müssen", musste: "müssen", mussten: "müssen", müsste: "müssen",
  will: "wollen", willst: "wollen", wollte: "wollen", wollten: "wollen",
  darf: "dürfen", darfst: "dürfen", durfte: "dürfen", durften: "dürfen", dürfte: "dürfen",
  soll: "sollen", sollst: "sollen", sollte: "sollen", sollten: "sollen",
  mag: "mögen", magst: "mögen", mochte: "mögen",
  weiß: "wissen", weißt: "wissen", wusste: "wissen", gewusst: "wissen",
  gibt: "geben", gab: "geben", gaben: "geben", gegeben: "geben",
  sieht: "sehen", sah: "sehen", sahen: "sehen", gesehen: "sehen",
  liest: "lesen", las: "lesen", gelesen: "lesen",
  fährt: "fahren", fuhr: "fahren", fuhren: "fahren", gefahren: "fahren",
  nimmt: "nehmen", nahm: "nehmen", nahmen: "nehmen", genommen: "nehmen",
  spricht: "sprechen", sprach: "sprechen", sprachen: "sprechen", gesprochen: "sprechen",
  hilft: "helfen", half: "helfen", geholfen: "helfen",
  ging: "gehen", gingen: "gehen", gegangen: "gehen",
  kam: "kommen", kamen: "kommen", gekommen: "kommen",
  isst: "essen", aß: "essen", gegessen: "essen",
  trifft: "treffen", traf: "treffen", trafen: "treffen", getroffen: "treffen",
  schläft: "schlafen", schlief: "schlafen", läuft: "laufen", lief: "laufen",
  trägt: "tragen", trug: "tragen", hält: "halten", hielt: "halten",
  fand: "finden", fanden: "finden", gefunden: "finden",
  blieb: "bleiben", blieben: "bleiben", geblieben: "bleiben",
  schrieb: "schreiben", geschrieben: "schreiben",
  stand: "stehen", standen: "stehen", gestanden: "stehen",
  saß: "sitzen", gesessen: "sitzen", lag: "liegen", gelegen: "liegen",
  dachte: "denken", gedacht: "denken", brachte: "bringen", gebracht: "bringen",
  kannte: "kennen", gekannt: "kennen", tat: "tun", tut: "tun", getan: "tun",
  rief: "rufen", gerufen: "rufen", verstand: "verstehen", verstanden: "verstehen",
  gilt: "gelten", galt: "gelten", gegolten: "gelten", wächst: "wachsen", wuchs: "wachsen", gewachsen: "wachsen",
  bekam: "bekommen", bekamen: "bekommen", bekommt: "bekommen",
};

// Small closed-class words whose inflected forms the stemmer would get wrong
// ("meine" is not "meinen"). Checked before anything else.
const FIXED_DE = (() => {
  const out = {};
  const def = (forms, head, en) => forms.split(" ").forEach((f) => { out[f] = { head, en, cat: "func", lvl: null, example: null }; });
  def("mein meine meinen meinem meiner meines", "mein", "my");
  def("dein deine deinen deinem deiner deines", "dein", "your (informal)");
  def("seine seinen seinem seiner seines", "sein", "his / its");
  def("ihre ihren ihrem ihrer ihres", "ihr", "her / their / your (formal)");
  def("unser unsere unseren unserem unserer unseres", "unser", "our");
  def("euer eure euren eurem eurer eures", "euer", "your (plural)");
  def("dem den des", "der / die / das", "the");
  def("im", "im = in dem", "in the");
  def("am", "am = an dem", "at / on the");
  def("ans", "ans = an das", "to the");
  def("ins", "ins = in das", "into the");
  def("zum", "zum = zu dem", "to the");
  def("zur", "zur = zu der", "to the");
  def("vom", "vom = von dem", "from / of the");
  def("beim", "beim = bei dem", "at / at the");
  def("sich", "sich", "oneself / himself / herself / themselves");
  def("mich mir", "ich → mich / mir", "me");
  def("dich dir", "du → dich / dir", "you");
  def("ihn ihm", "er → ihn / ihm", "him");
  def("uns", "wir → uns", "us / ourselves");
  def("euch", "ihr → euch", "you (plural)");
  def("ihnen", "sie → ihnen", "them");
  def("manche manchen mancher manches", "manche", "some");
  def("andere anderen anderer anderes anderem", "andere", "other(s)");
  def("mehr", "mehr", "more");
  return out;
})();
const STRIP_SUFFIXES = ["test", "tet", "ten", "est", "ern", "en", "em", "er", "es", "et", "st", "te", "e", "n", "s", "t"];

// A dictionary keyed by the bare German form (article / "sich" / "(Pl.)" removed),
// with a case-sensitive map (so "Essen" ≠ "essen") and a lowercase fallback map.
// First entry for a form wins, so callers add higher-priority sources first.
function makeGlossDict() {
  const exact = new Map();
  const lower = new Map();
  const put = (form, entry) => {
    if (!form) return;
    if (!exact.has(form)) exact.set(form, entry);
    const l = form.toLowerCase();
    if (!lower.has(l)) lower.set(l, entry);
  };
  const add = (de, en, cat, lvl, example, verbish) => {
    const cleaned = String(de || "").replace(/\s*\((?:Pl\.|WG)\)/g, "").replace(/\((sich)\)/g, "$1").trim();
    const heads = cleaned.split(/\s+\/\s+/).map((s) => s.trim()).filter(Boolean);
    const ens = String(en || "").split(/\s+\/\s+/);
    // "ich / du / er" ↔ "I / you / he": pair them up when the counts line up.
    const paired = heads.length > 1 && ens.length === heads.length;
    heads.forEach((h, i) => {
      const art = h.match(/^(der|die|das)\s/i);
      const entry = {
        head: paired ? h : cleaned,
        en: paired ? ens[i].trim() : en,
        cat: art && NOUN_CATS.includes(cat) ? art[1].toLowerCase() : cat,
        lvl,
        example: example || null,
      };
      const form = h.replace(/^(der|die|das)\s+/i, "").replace(/^sich\s+/i, "").replace(/\s*(\.\.\.|…)$/, "").trim();
      put(form, entry);
      // "aufhören mit" → also findable as "aufhören"
      if (verbish && form.includes(" ")) put(form.split(" ")[0], entry);
      // "je ... desto" → "je" and "desto" each lead back to the pair
      if (/\.\.\.|…/.test(form)) form.split(/\s*(?:\.\.\.|…)\s*/).forEach((piece) => put(piece.trim(), entry));
    });
  };
  return { exact, lower, add };
}

function glossCat(g) {
  if (g.type === "noun") {
    const m = String(g.de || "").match(/^(der|die|das)\b/i);
    return String(g.article || (m && m[1]) || "der").toLowerCase();
  }
  return GLOSS_TYPE_CAT[g.type] || null;
}
function addGlossary(dict, glossary) {
  (glossary || []).forEach((g) =>
    dict.add(g.de, g.en, glossCat(g), "B1", g.example, g.type === "verbs" || g.type === "separable_verbs")
  );
}

// Plausible base forms of an inflected word: irregulars, participles
// (gekündigt, umgesetzt), zu-infinitives, and stripped endings (+ -en / -n / -e).
function wordCandidates(word) {
  const lw = word.toLowerCase();
  const out = [lw];
  const push = (s) => { if (s && s.length >= 2) out.push(s); };
  if (IRREGULAR_DE[lw]) push(IRREGULAR_DE[lw]);
  // prefixed irregulars: annimmt → an + nehmen, verhält → ver + halten
  Object.keys(IRREGULAR_DE).forEach((k) => {
    if (k.length >= 4 && lw.length - k.length >= 2 && lw.endsWith(k)) push(lw.slice(0, -k.length) + IRREGULAR_DE[k]);
  });
  const bases = [lw];
  for (const p of SEP_PREFIXES) {
    if ((lw.startsWith(p + "ge") || lw.startsWith(p + "zu")) && lw.length > p.length + 4) {
      bases.push(p + lw.slice(p.length + 2));
      break;
    }
  }
  if (lw.startsWith("ge") && lw.length > 5) bases.push(lw.slice(2));
  bases.forEach((b) => {
    if (b !== lw) push(b);
    push(b + "en");
    push(b + "n");
    STRIP_SUFFIXES.forEach((suf) => {
      if (b.endsWith(suf) && b.length - suf.length >= 3) {
        const stem = b.slice(0, -suf.length);
        push(stem);
        push(stem + "en");
        push(stem + "n");
        push(stem + "e");
      }
    });
  });
  return out;
}

function makeLookup(dicts) {
  const cache = new Map();
  const lookup = (word) => {
    if (cache.has(word)) return cache.get(word);
    let hit = FIXED_DE[word.toLowerCase()] || null;
    if (!hit) for (const d of dicts) { hit = d.exact.get(word); if (hit) break; }
    if (!hit) {
      const cands = wordCandidates(word);
      outer: for (const c of cands) {
        for (const d of dicts) {
          const h = d.lower.get(c);
          if (h) { hit = h; break outer; }
        }
      }
    }
    // "Kinder-Betreuung" → try the last part on its own
    if (!hit && word.includes("-")) hit = lookup(word.split("-").pop());
    cache.set(word, hit || null);
    return hit || null;
  };
  return lookup;
}

// A **marked** span: whole span, then each " / " part, then each word, then the
// story glossary entry sharing the longest prefix (wahrnimmt → wahrnehmen).
function lookupTarget(span, lookup, glossary) {
  const clean = span.replace(/\s*\((?:Pl\.|WG)\)/g, "").replace(/^(der|die|das|den|dem|des)\s+/i, "").trim();
  let hit = lookup(clean);
  if (hit) return hit;
  const parts = clean.split(/\s+\/\s+/);
  if (parts.length > 1) {
    for (const p of parts) { hit = lookup(p.replace(/^(der|die|das)\s+/i, "")); if (hit) return hit; }
  }
  // split separable verb: "lehnt ab" → "ablehnt"
  const pair = clean.replace(/^sich\s+/i, "").split(/\s+/);
  if (pair.length === 2 && SEP_PREFIXES.includes(pair[1].toLowerCase())) {
    hit = lookup(pair[1].toLowerCase() + pair[0].toLowerCase());
    if (hit) return hit;
  }
  const words = clean.split(/\s+/).filter((w) => w.length > 2).sort((a, b) => b.length - a.length);
  if (clean.includes(" ")) {
    for (const w of words) { hit = lookup(w); if (hit) return hit; }
  }
  const lw = clean.toLowerCase();
  let best = null;
  let bestLen = 4;
  (glossary || []).forEach((g) => {
    const f = String(g.de || "").replace(/^(der|die|das)\s+/i, "").replace(/^sich\s+/i, "").toLowerCase();
    let n = 0;
    while (n < f.length && n < lw.length && f[n] === lw[n]) n++;
    if (n > bestLen) { bestLen = n; best = g; }
  });
  if (best) return { head: best.de, en: best.en, cat: glossCat(best), lvl: "B1", example: best.example || null };
  return null;
}

// Paragraph → segments: { t } plain text, or { w, entry, target } for a word.
function storySegments(para, lookup, glossary) {
  const segs = [];
  para.split(/\*\*(.+?)\*\*/).forEach((part, i) => {
    if (!part) return;
    if (i % 2 === 1) {
      segs.push({ w: part, entry: lookupTarget(part, lookup, glossary), target: true });
      return;
    }
    const re = /[A-Za-zÄÖÜäöüß]+(?:-[A-Za-zÄÖÜäöüß]+)*/g;
    let last = 0;
    let m;
    while ((m = re.exec(part))) {
      if (m.index > last) segs.push({ t: part.slice(last, m.index) });
      const entry = m[0].length > 1 ? lookup(m[0]) : null;
      segs.push(entry ? { w: m[0], entry } : { t: m[0] });
      last = m.index + m[0].length;
    }
    if (last < part.length) segs.push({ t: part.slice(last) });
  });
  return segs;
}

function storyParagraphs(text) {
  return String(text || "").split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);
}

function Switch({ on, onChange, label }) {
  return (
    <button

}

// Portalled to <body>: the tab wrapper keeps a transform from its entrance
// animation, which would otherwise break position: fixed. Re-measures the word
// on scroll / resize so the tip follows it instead of vanishing.
function WordTip({ tip }) {
  const { el, entry, word } = tip;
  const [, reflow] = useState(0);
  React.useEffect(() => {
    const onMove = () => reflow((n) => n + 1);
    window.addEventListener("scroll", onMove, true);
    window.addEventListener("resize", onMove);
    return () => {
      window.removeEventListener("scroll", onMove, true);
      window.removeEventListener("resize", onMove);
    };
  }, []);
  const rect = el.getBoundingClientRect();
  const vw = document.documentElement.clientWidth || window.innerWidth;
  const w = Math.min(270, vw - 32);
  const cx = Math.min(Math.max(rect.left + rect.width / 2, w / 2 + 16), vw - w / 2 - 16);
  const above = rect.top > 170;
  const bare = String(entry.head || "").replace(/^(der|die|das)\s+/i, "").toLowerCase();
  return ReactDOM.createPortal(
    <div
      data-tip="1"
      role="tooltip"
      style={{
        position: "fixed", zIndex: 50, left: cx, width: w, boxSizing: "border-box",
        top: above ? rect.top - 8 : rect.bottom + 8,
        transform: above ? "translate(-50%, -100%)" : "translate(-50%, 0)",
        background: "var(--paper-raised)", border: "1px solid var(--line)", borderRadius: "12px",
        boxShadow: "var(--shadow-card)", padding: "12px 14px", textAlign: "left",
        animation: "tipIn .14s ease both",
      }}
    >
      <div style={{ display: "flex", alignItems: "center", gap: "8px", marginBottom: "6px", flexWrap: "wrap" }}>
        {entry.cat && CATEGORY_META[entry.cat] && <CatChip cat={entry.cat} />}
        {entry.lvl && <span style={{ fontFamily: "var(--font-mono)", fontSize: "9px", letterSpacing: "0.12em", color: "var(--ink-faint)" }}>{entry.lvl}</span>}
        {tip.pinned && <span style={{ marginLeft: "auto" }}><SpeakButton text={entry.head} size={28} /></span>}
      </div>
      <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "17px", color: "var(--ink)", lineHeight: 1.3 }}>{entry.head}</div>
      <div style={{ fontFamily: "var(--font-serif)", fontStyle: "italic", fontSize: "15px", color: "var(--ink-soft)", marginTop: "3px", lineHeight: 1.4 }}>{entry.en}</div>
      {word.toLowerCase() !== bare && (
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "9px", letterSpacing: "0.08em", color: "var(--ink-faint)", marginTop: "6px" }}>
          im Text: {word}
        </div>
      )}
      {entry.example && (
        <div style={{ fontFamily: "var(--font-serif)", fontSize: "13px", color: "var(--ink-soft)", marginTop: "8px", paddingTop: "8px", borderTop: "1px solid var(--line)", lineHeight: 1.45 }}>
          {entry.example}
        </div>
      )}
    </div>,
    document.body
  );
}

function StoryReader({ story, globalDict, showEn, onShowEn, isRead, onToggleRead, prev, next, onOpen, onBack }) {
  const [tip, setTip] = useState(null);
  const [glossOpen, setGlossOpen] = useState(false);
  const topRef = React.useRef(null);

  const paras = useMemo(() => {
    const storyDict = makeGlossDict();
    addGlossary(storyDict, story.glossary);
    const lookup = makeLookup([storyDict, globalDict]);
    return storyParagraphs(story.story_de).map((p) => storySegments(p, lookup, story.glossary));
  }, [story, globalDict]);
  const enParas = useMemo(() => storyParagraphs(story.story_en), [story]);

  React.useEffect(() => {
    setTip(null);
    setGlossOpen(false);
    if (topRef.current && topRef.current.getBoundingClientRect().top < 0) topRef.current.scrollIntoView({ block: "start" });
  }, [story.id]);

  // Close the tooltip on tap outside or Escape.
  React.useEffect(() => {
    if (!tip) return;
    const onDown = (e) => {
      if (e.target && e.target.closest && e.target.closest("[data-sw],[data-tip]")) return;
      setTip(null);
    };
    const onKey = (e) => { if (e.key === "Escape") setTip(null); };
    document.addEventListener("pointerdown", onDown);
    window.addEventListener("keydown", onKey);
    return () => {
      document.removeEventListener("pointerdown", onDown);
      window.removeEventListener("keydown", onKey);
    };
  }, [tip]);

  const show = (e, key, seg, pinned) =>
    setTip({ key, el: e.currentTarget, entry: seg.entry, word: seg.w, pinned });

  return (
    <div ref={topRef} style={{ ...srsCol, width: "100%", maxWidth: "620px", margin: "0 auto", gap: "18px", alignItems: "stretch", scrollMarginTop: "12px" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: "10px" }}>
        <button onClick={onBack} style={miniBtn}>‹ alle Geschichten</button>
        <span style={{ fontFamily: "var(--font-mono)", fontSize: "9px", letterSpacing: "0.12em", textTransform: "uppercase", color: "var(--ink-faint)", textAlign: "right" }}>
          Kapitel {story.chapter}{story.phase_name ? " · " + story.phase_name : ""}
        </span>
      </div>

      <div style={{ textAlign: "center" }}>
        <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "24px", lineHeight: 1.25, color: "var(--ink)" }}>{story.title_de}</div>
        <div style={{ fontFamily: "var(--font-serif)", fontStyle: "italic", fontSize: "14px", color: "var(--ink-soft)", marginTop: "4px" }}>{story.title_en}</div>
      </div>

      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "8px" }}>
        <Switch on={showEn} onChange={onShowEn} label="English translation" />
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "9px", letterSpacing: "0.08em", color: "var(--ink-faint)", textAlign: "center", lineHeight: 1.6 }}>
          <span className="st" style={{ fontFamily: "var(--font-serif)", fontSize: "12px", letterSpacing: 0 }}>underlined</span> = B1 target word · tap{window.matchMedia && window.matchMedia("(hover: hover)").matches ? " or hover" : ""} any word for its meaning
        </div>
      </div>

      {paras.map((segs, pi) => (
        <div key={story.id + "-" + pi} style={{ display: "flex", gap: "10px", alignItems: "flex-start" }}>
          <div style={{ flex: 1, minWidth: 0 }}>
            <p style={{ margin: 0, fontFamily: "var(--font-serif)", fontSize: "18px", lineHeight: 1.75, color: "var(--ink)" }}>
              {segs.map((seg, si) => {
                if (seg.t != null) return <React.Fragment key={si}>{seg.t}</React.Fragment>;
                const key = pi + "-" + si;
                if (!seg.entry) return <span key={si} className="st">{seg.w}</span>;
                const on = tip && tip.key === key;
                return (
                  <span
                    key={si}
                    data-sw="1"
                    className={(seg.target ? "st sw" : "sw") + (on ? " on" : "")}
                    onPointerEnter={(e) => { if (e.pointerType === "mouse" && !(tip && tip.pinned)) show(e, key, seg, false); }}
                    onPointerLeave={(e) => { if (e.pointerType === "mouse") setTip((t) => (t && !t.pinned ? null : t)); }}
                    onClick={(e) => { if (tip && tip.key === key && tip.pinned) setTip(null); else show(e, key, seg, true); }}
                  >
                    {seg.w}
                  </span>
                );
              })}
            </p>
            {showEn && enParas[pi] && (
              <p style={{ margin: "8px 0 0", padding: "2px 0 2px 12px", borderLeft: "2px solid var(--line)", fontFamily: "var(--font-serif)", fontStyle: "italic", fontSize: "15px", lineHeight: 1.6, color: "var(--ink-soft)" }}>
                {enParas[pi]}
              </p>
            )}
          </div>
          <SpeakButton text={segs.map((s) => (s.t != null ? s.t : s.w)).join("")} size={30} />
        </div>
      ))}

      {story.glossary && story.glossary.length > 0 && (
        <div style={{ borderTop: "1px solid var(--line)", paddingTop: "14px" }}>
          <button
            onClick={() => setGlossOpen((o) => !o)}
